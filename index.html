<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Junction Map</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #1e272e; /* नकाश्याचा डार्क रंग */
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        canvas { 
            background: #2f3640; /* जमिनीचा रंग */
            display: block; width: 100%; height: 100vh;
        }

        .map-ui {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff; padding: 15px 20px;
            border-radius: 12px; border: 1px solid #7f8fa6;
            pointer-events: none;
        }
        .map-ui h1 { font-size: 18px; color: #00a8ff; margin-bottom: 5px; }
        .map-ui p { font-size: 12px; color: #dcdde1; }
        
        .legend { margin-top: 10px; font-size: 11px; }
        .legend-item { display: flex; align-items: center; margin-top: 5px; }
        .box { width: 12px; height: 12px; margin-right: 8px; border-radius: 3px; }
    </style>
</head>
<body>

    <!-- नकाश्यावर दिसणारी माहिती -->
    <div class="map-ui">
        <h1>🛤️ Central Junction Map</h1>
        <p>Live Train Tracking Simulation</p>
        <div class="legend">
            <div class="legend-item"><div class="box" style="background: #e84118;"></div> Superfast Express</div>
            <div class="legend-item"><div class="box" style="background: #00a8ff;"></div> City Local Train</div>
            <div class="legend-item"><div class="box" style="background: #4cd137;"></div> Goods Train (मालगाडी)</div>
            <div class="legend-item"><div class="box" style="background: #fbc531;"></div> Passenger Train</div>
        </div>
    </div>

    <!-- मुख्य नकाशा -->
    <canvas id="mapCanvas"></canvas>

    <script>
        const canvas = document.getElementById("mapCanvas");
        const ctx = canvas.getContext("2d");

        let cw, ch;
        function resize() {
            cw = window.innerWidth;
            ch = window.innerHeight;
            canvas.width = cw;
            canvas.height = ch;
        }
        window.addEventListener('resize', resize);
        resize();

        // ==========================================
        // १. ट्रेन्सचा डेटा (४ वेगवेगळ्या ट्रेन्स)
        // ==========================================
        const trains = [
            { id: 1, type: "Express", color: "#e84118", x: -200, y: 0, vx: 3, vy: 0, coaches: 6 }, // डावीकडून उजवीकडे (जलद)
            { id: 2, type: "Local", color: "#00a8ff", x: cw + 300, y: 0, vx: -2, vy: 0, coaches: 4 }, // उजवीकडून डावीकडे (मध्यम)
            { id: 3, type: "Goods", color: "#4cd137", x: 0, y: -400, vx: 0, vy: 1.5, coaches: 10 }, // वरून खाली (मालगाडी - संथ आणि मोठी)
            { id: 4, type: "Passenger", color: "#fbc531", x: 0, y: ch + 200, vx: 0, vy: -2.5, coaches: 5 } // खालून वर
        ];

        // ==========================================
        // २. नकाशा आणि रूळ काढणे (Draw Map & Tracks)
        // ==========================================
        function drawMap() {
            // ट्रॅक्सची पोझिशन सेट करणे (स्क्रीनच्या मध्यभागी)
            trains[0].trackY = ch * 0.35; // आडवा ट्रॅक १
            trains[1].trackY = ch * 0.65; // आडवा ट्रॅक २
            trains[2].trackX = cw * 0.30; // उभा ट्रॅक १
            trains[3].trackX = cw * 0.70; // उभा ट्रॅक २

            ctx.lineWidth = 4;
            
            // आडवे रूळ काढणे
            [trains[0].trackY, trains[1].trackY].forEach(y => {
                // लाकडी पट्ट्या (Sleepers)
                ctx.strokeStyle = "#718093"; ctx.lineWidth = 2;
                for(let i=0; i<cw; i+=20) { ctx.beginPath(); ctx.moveTo(i, y-12); ctx.lineTo(i, y+12); ctx.stroke(); }
                // लोखंडी रूळ
                ctx.strokeStyle = "#dcdde1"; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(0, y-8); ctx.lineTo(cw, y-8); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, y+8); ctx.lineTo(cw, y+8); ctx.stroke();
            });

            // उभे रूळ काढणे
            [trains[2].trackX, trains[3].trackX].forEach(x => {
                // लाकडी पट्ट्या (Sleepers)
                ctx.strokeStyle = "#718093"; ctx.lineWidth = 2;
                for(let i=0; i<ch; i+=20) { ctx.beginPath(); ctx.moveTo(x-12, i); ctx.lineTo(x+12, i); ctx.stroke(); }
                // लोखंडी रूळ
                ctx.strokeStyle = "#dcdde1"; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(x-8, 0); ctx.lineTo(x-8, ch); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x+8, 0); ctx.lineTo(x+8, ch); ctx.stroke();
            });
        }

        // ==========================================
        // ३. ट्रेन्स आणि डबे काढणे (Draw Trains)
        // ==========================================
        function drawTrains() {
            const coachLen = 35; // डब्याची लांबी
            const coachWid = 14; // डब्याची रुंदी
            const gap = 4; // डब्यांमधलं अंतर

            trains.forEach(t => {
                // ट्रेनला पुढे सरकवणे
                t.x += t.vx;
                t.y += t.vy;

                // ट्रेन आडवी धावत आहे की उभी, ते चेक करणे
                let isHorizontal = Math.abs(t.vx) > 0;
                
                // ट्रॅक सेट करणे
                let currentX = isHorizontal ? t.x : t.trackX;
                let currentY = isHorizontal ? t.trackY : t.y;

                // इंजिन आणि डबे काढणे
                for (let i = 0; i <= t.coaches; i++) {
                    let drawX = currentX;
                    let drawY = currentY;

                    // डबे इंजिनच्या मागे कसे लावायचे? (दिशेनुसार)
                    if (t.vx > 0) drawX -= i * (coachLen + gap); // उजवीकडे जात असेल तर डबे डावीकडे
                    else if (t.vx < 0) drawX += i * (coachLen + gap); // डावीकडे जात असेल तर डबे उजवीकडे
                    
                    if (t.vy > 0) drawY -= i * (coachLen + gap); // खाली जात असेल तर डबे वरती
                    else if (t.vy < 0) drawY += i * (coachLen + gap); // वर जात असेल तर डबे खाली

                    ctx.fillStyle = (i === 0) ? "#f5f6fa" : t.color; // पहिला डबा इंजिन (पांढरा)
                    
                    // डबा काढणे (आडवा किंवा उभा)
                    if (isHorizontal) {
                        ctx.fillRect(drawX - coachLen/2, drawY - coachWid/2, coachLen, coachWid);
                        // खिडक्या (Windows)
                        if(i !== 0) { ctx.fillStyle = "#2f3640"; ctx.fillRect(drawX - coachLen/4, drawY - 2, coachLen/2, 4); }
                    } else {
                        ctx.fillRect(drawX - coachWid/2, drawY - coachLen/2, coachWid, coachLen);
                        // खिडक्या (Windows)
                        if(i !== 0) { ctx.fillStyle = "#2f3640"; ctx.fillRect(drawX - 2, drawY - coachLen/4, 4, coachLen/2); }
                    }
                }

                // ==========================================
                // ४. स्क्रीनच्या बाहेर गेल्यावर ट्रेन पुन्हा आणणे
                // ==========================================
                let totalLength = (t.coaches + 1) * (coachLen + gap);
                
                if (t.vx > 0 && t.x - totalLength > cw) t.x = -100;
                if (t.vx < 0 && t.x + totalLength < 0) t.x = cw + 100;
                
                if (t.vy > 0 && t.y - totalLength > ch) t.y = -100;
                if (t.vy < 0 && t.y + totalLength < 0) t.y = ch + 100;
            });
        }

        // ==========================================
        // ५. ॲनिमेशन इंजिन (Loop)
        // ==========================================
        function animate() {
            ctx.clearRect(0, 0, cw, ch);
            drawMap();    // आधी नकाशा आणि रूळ काढा
            drawTrains(); // त्यावर ट्रेन्स पळवा
            requestAnimationFrame(animate);
        }

        animate(); // सिस्टीम चालू!
    </script>
</body>
</html>
