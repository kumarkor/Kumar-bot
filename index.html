<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emoji City Life Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', sans-serif; }
        body { background: #4ade80; /* हिरवीगार जमीन */ overflow: hidden; touch-action: none; color: #fff; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
        canvas:active { cursor: grabbing; }

        /* UI Dashboard */
        .dashboard { position: absolute; top: 15px; left: 15px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); padding: 15px; border-radius: 15px; border: 2px solid #f59e0b; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .dash-title { font-size: 18px; font-weight: 900; color: #fcd34d; margin-bottom: 8px; }
        .clock { background: #000; color: #10b981; font-family: monospace; font-size: 28px; font-weight: bold; padding: 8px 15px; border-radius: 8px; border: 1px solid #10b981; text-align: center; margin-bottom: 10px; }
        
        .info-panel { font-size: 12px; color: #cbd5e1; margin-bottom: 10px; line-height: 1.5; }
        
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; background: #334155; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; border: 1px solid #475569; }
        .btn:hover { background: #38bdf8; color: #000; }

        #followInfo { display: none; position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.85); border-left: 4px solid #38bdf8; padding: 15px; border-radius: 10px; z-index: 10; }
        .target-name { font-size: 14px; color: #38bdf8; font-weight: bold; margin-bottom: 5px; }
        .target-status { font-size: 12px; color: #10b981; }

        .hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 12px; pointer-events: none; z-index: 10; font-weight: bold; }
        
        /* Minimap */
        .minimap-container { position: absolute; bottom: 20px; right: 20px; width: 140px; height: 140px; background: rgba(0, 0, 0, 0.8); border: 2px solid #fff; border-radius: 50%; z-index: 10; overflow: hidden; }
        #minimap { width: 100%; height: 100%; border-radius: 50%; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="dash-title">🏫 Emoji City Life</div>
        <div class="clock" id="gameClock">08:00</div>
        <div class="info-panel" id="busStatus">🚌 School Bus: Sleeping</div>
        <div class="btn-group">
            <button class="btn" onclick="timeSpeed = timeSpeed === 1 ? 10 : 1">⏩ Fast Time</button>
            <button class="btn" onclick="unfollow()">🌍 Free Cam</button>
        </div>
    </div>

    <div id="followInfo">
        <div class="target-name" id="fName">Target</div>
        <div class="target-status" id="fStatus">Status</div>
    </div>

    <div class="hint">👆 Click Bus/Train to Follow | 🔍 Pinch to Zoom</div>
    <div class="minimap-container"><canvas id="minimap"></canvas></div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const mCanvas = document.getElementById("minimap");
        const mCtx = mCanvas.getContext("2d");

        const WORLD_SIZE = 4000;
        let cam = { x: 2000, y: 2000, zoom: 0.8 };
        let isDragging = false, startX, startY, camStartX, camStartY;
        let followedTarget = null;
        let timeSpeed = 1;

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; mCanvas.width = 140; mCanvas.height = 140; }
        window.addEventListener('resize', resize); resize();

        // Controls
        canvas.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX; startY = e.clientY; camStartX = cam.x; camStartY = cam.y; unfollow(); });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => { if(isDragging) { cam.x = camStartX - (e.clientX - startX)/cam.zoom; cam.y = camStartY - (e.clientY - startY)/cam.zoom; } });
        canvas.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = Math.min(Math.max(0.3, cam.zoom * (e.deltaY > 0 ? 0.9 : 1.1)), 2.5); });

        // Touch
        let initPinch = null, initZoom = null;
        canvas.addEventListener('touchstart', e => {
            if(e.touches.length === 1) { isDragging=true; startX=e.touches[0].clientX; startY=e.touches[0].clientY; camStartX=cam.x; camStartY=cam.y; unfollow(); }
            else if(e.touches.length === 2) { initPinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); initZoom = cam.zoom; }
        });
        window.addEventListener('touchend', () => { isDragging = false; initPinch = null; });
        window.addEventListener('touchmove', e => {
            if(e.touches.length === 1 && isDragging && !initPinch) { cam.x = camStartX - (e.touches[0].clientX - startX)/cam.zoom; cam.y = camStartY - (e.touches[0].clientY - startY)/cam.zoom; }
            else if(e.touches.length === 2 && initPinch) { let dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); cam.zoom = Math.min(Math.max(0.3, initZoom * (dist/initPinch)), 2.5); }
        });

        // Click to follow
        canvas.addEventListener('click', e => {
            if(isDragging) return;
            let wx = (e.clientX - canvas.width/2)/cam.zoom + cam.x; let wy = (e.clientY - canvas.height/2)/cam.zoom + cam.y;
            if(Math.hypot(schoolBus.x - wx, schoolBus.y - wy) < 80) setFollow(schoolBus, "🚌 School Bus");
            trains.forEach(t => { if(Math.hypot(t.x - wx, t.y - wy) < 100) setFollow(t, t.icon + " " + t.name); });
            cars.forEach(c => { if(Math.hypot(c.x - wx, c.y - wy) < 60) setFollow(c, "🚗 City Car"); });
        });
        
        function setFollow(target, name) { followedTarget = target; followedTarget.displayName = name; document.getElementById('followInfo').style.display = 'block'; document.getElementById('fName').innerText = name; }
        function unfollow() { followedTarget = null; document.getElementById('followInfo').style.display = 'none'; }

        // ==========================================
        // 2. TIME SYSTEM
        // ==========================================
        let gameTimeMins = 8 * 60; // Start at 08:00
        let lastTime = performance.now();
        let isNight = false;

        function updateTime(dt) {
            gameTimeMins += (dt / 1000) * 2 * timeSpeed;
            if (gameTimeMins >= 24 * 60) gameTimeMins = 0;
            let h = Math.floor(gameTimeMins / 60).toString().padStart(2, '0');
            let m = Math.floor(gameTimeMins % 60).toString().padStart(2, '0');
            document.getElementById("gameClock").innerText = `${h}:${m}`;
            isNight = (gameTimeMins >= 18.5 * 60 || gameTimeMins <= 5.5 * 60);
        }

        // ==========================================
        // 3. EMOJI ENVIRONMENT 🌲🏫🏨
        // ==========================================
        const places = [
            { id: "School", emoji: "🏫", x: 1200, y: 1500, size: 80 },
            { id: "Hospital", emoji: "🏨", x: 2800, y: 1500, size: 80 },
            { id: "BusDepot", emoji: "🏢", x: 2800, y: 2500, size: 70 },
            { id: "Station", emoji: "🚉", x: 2000, y: 3200, size: 90 }
        ];
        
        const trees = [];
        for(let i=0; i<150; i++) trees.push({ x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE, e: Math.random()>0.5?"🌲":"🌳", s: 40+Math.random()*20 });
        
        const people = [];
        for(let i=0; i<50; i++) people.push({ x: 1000+Math.random()*2000, y: 1200+Math.random()*2000, e: "🚶", s: 20 });

        // Roads
        const roads = [
            { x1: 1000, y1: 1700, w: 2000, h: 80 }, // Horizontal Main
            { x1: 1200, y1: 1700, w: 60, h: 1000 }, // Vertical to School
            { x1: 2800, y1: 1700, w: 60, h: 1000 }  // Vertical to Hospital/Depot
        ];

        // ==========================================
        // 4. SMART SCHOOL BUS AI 🚌
        // ==========================================
        const schoolBus = {
            x: 2830, y: 2500, // Starts at Depot
            targetX: 2830, targetY: 2500,
            state: "SLEEPING", speed: 4, angle: -Math.PI/2
        };

        function updateSchoolBus() {
            let hour = gameTimeMins / 60;
            let statusText = "";

            if (hour >= 9 && hour < 10 && schoolBus.state !== "GOING_TO_SCHOOL" && schoolBus.state !== "AT_SCHOOL") {
                schoolBus.state = "GOING_TO_SCHOOL";
                schoolBus.targetX = 1230; schoolBus.targetY = 1700; // Go to school
            } 
            else if (hour >= 10 && hour < 17 && schoolBus.state === "GOING_TO_SCHOOL") {
                // If it reached school
                if (Math.hypot(schoolBus.x - schoolBus.targetX, schoolBus.y - schoolBus.targetY) < 10) {
                    schoolBus.state = "AT_SCHOOL";
                }
            }
            else if (hour >= 17 && schoolBus.state === "AT_SCHOOL") {
                schoolBus.state = "GOING_HOME";
                schoolBus.targetX = 2830; schoolBus.targetY = 2500; // Back to depot
            }
            else if (hour >= 18 && schoolBus.state === "GOING_HOME") {
                if (Math.hypot(schoolBus.x - schoolBus.targetX, schoolBus.y - schoolBus.targetY) < 10) {
                    schoolBus.state = "SLEEPING";
                }
            }

            // Movement Logic for Bus
            let dx = schoolBus.targetX - schoolBus.x;
            let dy = schoolBus.targetY - schoolBus.y;
            let dist = Math.hypot(dx, dy);
            
            if (dist > schoolBus.speed * timeSpeed) {
                schoolBus.angle = Math.atan2(dy, dx);
                schoolBus.x += Math.cos(schoolBus.angle) * schoolBus.speed * timeSpeed;
                schoolBus.y += Math.sin(schoolBus.angle) * schoolBus.speed * timeSpeed;
            }

            // Update UI
            if(schoolBus.state === "SLEEPING") statusText = "💤 Sleeping at Depot";
            if(schoolBus.state === "GOING_TO_SCHOOL") statusText = "🚌 Picking up Kids -> School";
            if(schoolBus.state === "AT_SCHOOL") statusText = "🏫 Parked at School (Classes on)";
            if(schoolBus.state === "GOING_HOME") statusText = "🚌 Dropping Kids -> Home";
            document.getElementById("busStatus").innerText = "Bus Status: " + statusText;
            if(followedTarget === schoolBus) document.getElementById("fStatus").innerText = statusText;
        }

        // ==========================================
        // 5. CARS (Only 5-6 Clean cars) 🚗
        // ==========================================
        const carColors = ["#ef4444", "#3b82f6", "#f59e0b", "#fff", "#a855f7"];
        const cars = [];
        for(let i=0; i<6; i++) {
            cars.push({
                x: 1000 + Math.random()*1800, y: 1740, 
                targetX: 1000 + Math.random()*1800, targetY: 1740,
                speed: 3 + Math.random()*2, c: carColors[i], angle: 0, wait: 0
            });
        }

        function updateCars(dt) {
            cars.forEach(c => {
                if (c.wait > 0) { c.wait -= dt * timeSpeed; return; }
                
                let dx = c.targetX - c.x; let dy = c.targetY - c.y;
                let dist = Math.hypot(dx, dy);
                
                // Stop for Train Crossing 🚧 (at x=2000)
                let trainCrossing = trainGateClosed && Math.abs(c.x - 2000) < 100;
                
                if (trainCrossing) { /* Brake */ }
                else if (dist < c.speed * timeSpeed + 5) {
                    c.x = c.targetX; c.y = c.targetY;
                    c.wait = 2000 + Math.random()*3000;
                    c.targetX = 1000 + Math.random()*1800; // Pick new point on main road
                } else {
                    c.angle = Math.atan2(dy, dx);
                    c.x += Math.cos(c.angle) * c.speed * timeSpeed;
                    c.y += Math.sin(c.angle) * c.speed * timeSpeed;
                }
            });
        }

        // ==========================================
        // 6. CONNECTED TRAIN TRACKS & 3 TRAINS 🛤️🚃
        // ==========================================
        // To fix the "derail" bug, we use exact Waypoints and draw tracks strictly on them.
        const trackWaypoints = [
            {x: 800, y: 3200}, {x: 800, y: 800}, {x: 3200, y: 800}, {x: 3200, y: 3200} // Outer Loop
        ];
        
        // Train Data
        const trains = [
            { name: "Superfast", icon: "🚄", wpIdx: 0, x: 800, y: 3200, speed: 8, angle: 0 },
            { name: "Metro", icon: "🚇", wpIdx: 2, x: 3200, y: 800, speed: 6, angle: 0 },
            { name: "Goods Train", icon: "🚂", wpIdx: 3, x: 3200, y: 3200, speed: 4, angle: 0 }
        ];

        let trainGateClosed = false;

        function updateTrains() {
            trainGateClosed = false;
            trains.forEach(t => {
                // If train is near road crossing (y=1700)
                if (t.x === 800 && Math.abs(t.y - 1700) < 300) trainGateClosed = true;
                if (t.x === 3200 && Math.abs(t.y - 1700) < 300) trainGateClosed = true;

                let targetWp = trackWaypoints[(t.wpIdx + 1) % trackWaypoints.length];
                let dx = targetWp.x - t.x;
                let dy = targetWp.y - t.y;
                let dist = Math.hypot(dx, dy);
                let actualSpeed = t.speed * timeSpeed;

                if (dist < actualSpeed) {
                    t.x = targetWp.x; t.y = targetWp.y;
                    t.wpIdx = (t.wpIdx + 1) % trackWaypoints.length;
                } else {
                    t.angle = Math.atan2(dy, dx);
                    t.x += Math.cos(t.angle) * actualSpeed;
                    t.y += Math.sin(t.angle) * actualSpeed;
                }

                if(followedTarget === t) document.getElementById("fStatus").innerText = `Speed: ${Math.round(t.speed*10)} km/h`;
            });
        }

        // ==========================================
        // 7. RENDER ENGINE (Emojis & Clean Graphics)
        // ==========================================
        function drawWorld() {
            // Base Grass
            ctx.fillStyle = isNight ? "#064e3b" : "#4ade80"; ctx.fillRect(0,0,WORLD_SIZE,WORLD_SIZE);

            // Trees 🌲
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            trees.forEach(t => { ctx.font = `${t.s}px sans-serif`; ctx.fillText(t.e, t.x, t.y); });

            // Roads 🛣️
            ctx.fillStyle = isNight ? "#1e293b" : "#64748b";
            roads.forEach(r => { ctx.fillRect(r.x1, r.y1, r.w, r.h); });

            // Perfect Connected Tracks 🛤️
            ctx.beginPath(); ctx.strokeStyle = "#475569"; ctx.lineWidth = 12; ctx.setLineDash([8, 12]);
            ctx.moveTo(trackWaypoints[0].x, trackWaypoints[0].y);
            trackWaypoints.forEach(wp => ctx.lineTo(wp.x, wp.y)); ctx.closePath(); ctx.stroke();
            
            ctx.beginPath(); ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 16; ctx.setLineDash([]);
            ctx.moveTo(trackWaypoints[0].x, trackWaypoints[0].y);
            trackWaypoints.forEach(wp => ctx.lineTo(wp.x, wp.y)); ctx.closePath(); ctx.stroke();
            
            ctx.beginPath(); ctx.strokeStyle = isNight ? "#000" : "#1e293b"; ctx.lineWidth = 10;
            ctx.moveTo(trackWaypoints[0].x, trackWaypoints[0].y);
            trackWaypoints.forEach(wp => ctx.lineTo(wp.x, wp.y)); ctx.closePath(); ctx.stroke();

            // Phatak 🚧
            if(trainGateClosed) {
                ctx.fillStyle = "#ef4444"; ctx.fillRect(750, 1680, 100, 10); ctx.fillRect(3150, 1680, 100, 10);
                ctx.font = "20px sans-serif"; ctx.fillText("🚧", 800, 1670); ctx.fillText("🚧", 3200, 1670);
            }

            // Places (Buildings) 🏫🏨
            places.forEach(p => {
                ctx.font = `${p.size}px sans-serif`; ctx.fillText(p.emoji, p.x, p.y);
                if(isNight) { ctx.fillStyle="rgba(253, 224, 71, 0.3)"; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); }
            });

            // People 🚶
            people.forEach(p => { ctx.font = `${p.s}px sans-serif`; ctx.fillText(p.e, p.x, p.y); });

            // Cars 🚗
            cars.forEach(c => {
                ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.angle);
                ctx.fillStyle = c.c; ctx.beginPath(); ctx.roundRect(-20, -10, 40, 20, 5); ctx.fill();
                ctx.fillStyle = "#000"; ctx.fillRect(-10, -8, 20, 16); // Roof
                if(isNight) { ctx.fillStyle="rgba(255,255,200,0.5)"; ctx.beginPath(); ctx.arc(30, 0, 40, -0.5, 0.5); ctx.fill(); }
                ctx.restore();
            });

            // School Bus 🚌
            ctx.save(); ctx.translate(schoolBus.x, schoolBus.y); ctx.rotate(schoolBus.angle);
            ctx.font = "40px sans-serif"; ctx.fillText("🚌", 0, 0);
            if(isNight && schoolBus.state !== "SLEEPING") { ctx.fillStyle="rgba(255,255,200,0.5)"; ctx.beginPath(); ctx.arc(30, 0, 50, -0.5, 0.5); ctx.fill(); }
            ctx.restore();

            // Trains 🚃
            trains.forEach(t => {
                ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.angle);
                ctx.font = "45px sans-serif";
                ctx.fillText(t.icon, 0, 0); // Engine
                // Coaches (Drawing 3 coaches behind using rotation math simply)
                for(let i=1; i<=3; i++) { ctx.fillText("🚃", -i*45, 0); }
                ctx.restore();
            });
        }

        function drawMinimap() {
            mCtx.clearRect(0,0,140,140); let scale = 140/WORLD_SIZE;
            
            // Map bounds
            mCtx.fillStyle = "#4ade80"; mCtx.fillRect(0,0,140,140);
            
            // Track loop
            mCtx.strokeStyle = "#475569"; mCtx.strokeRect(800*scale, 800*scale, 2400*scale, 2400*scale);

            // Bus & Trains
            mCtx.fillStyle = "#f59e0b"; mCtx.beginPath(); mCtx.arc(schoolBus.x*scale, schoolBus.y*scale, 4, 0, Math.PI*2); mCtx.fill();
            trains.forEach(t => { mCtx.fillStyle = "#ef4444"; mCtx.beginPath(); mCtx.arc(t.x*scale, t.y*scale, 3, 0, Math.PI*2); mCtx.fill(); });

            // Camera View
            mCtx.strokeStyle = "#fff"; mCtx.lineWidth = 1;
            let vW = (canvas.width/cam.zoom)*scale, vH = (canvas.height/cam.zoom)*scale;
            mCtx.strokeRect((cam.x*scale)-vW/2, (cam.y*scale)-vH/2, vW, vH);
        }

        // ==========================================
        // 8. MAIN ANIMATION LOOP
        // ==========================================
        function animate(time) {
            let dt = time - lastTime; lastTime = time;
            
            updateTime(dt); updateSchoolBus(); updateCars(dt); updateTrains();
            
            if(followedTarget) { cam.x = followedTarget.x; cam.y = followedTarget.y; }

            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.save(); ctx.translate(canvas.width/2, canvas.height/2); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-cam.x, -cam.y);
            
            drawWorld();
            
            if(isNight) { ctx.fillStyle = "rgba(0,10,30,0.7)"; ctx.fillRect(0,0,WORLD_SIZE,WORLD_SIZE); }
            ctx.restore(); drawMinimap();
            
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
    </script>
</body>
</html>
