<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real City Railway Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #000; overflow: hidden; touch-action: none; color: #fff; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
        canvas:active { cursor: grabbing; }

        /* UI Dashboard */
        .dashboard { position: absolute; top: 10px; left: 10px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); padding: 15px; border-radius: 12px; border: 1px solid #38bdf8; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .dash-title { font-size: 18px; font-weight: 900; color: #38bdf8; margin-bottom: 5px; text-transform: uppercase; }
        .clock { background: #000; color: #10b981; font-family: monospace; font-size: 26px; font-weight: bold; padding: 5px 15px; border-radius: 8px; border: 1px solid #10b981; cursor: pointer; text-align: center; margin-bottom: 10px; }
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; background: #334155; color: white; border: none; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; border: 1px solid #475569; }
        .btn:hover { background: #38bdf8; color: #000; }

        /* Mini Map (Radar) */
        .minimap-container { position: absolute; bottom: 20px; right: 20px; width: 150px; height: 150px; background: rgba(0, 0, 0, 0.8); border: 2px solid #38bdf8; border-radius: 10px; z-index: 10; overflow: hidden; }
        #minimap { width: 100%; height: 100%; }

        /* Settings Modal */
        #settingsPanel { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.95); padding: 20px; border-radius: 12px; border: 2px solid #f59e0b; z-index: 100; width: 300px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
        .set-title { color: #f59e0b; font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .set-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 14px; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(20px); }
        .close-btn { width: 100%; background: #ef4444; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* Timetable / Info */
        #infoPanel { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; border-right: 4px solid #10b981; z-index: 10; font-size: 12px; max-width: 200px; text-align: right; }
        
        .hint { position: absolute; bottom: 20px; left: 20px; color: #94a3b8; font-size: 11px; z-index: 10; pointer-events: none; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 20px; }
    </style>
</head>
<body>

    <!-- Main UI -->
    <div class="dashboard">
        <div class="dash-title">🚉 Global Transit</div>
        <div class="clock" id="gameClock" onclick="toggleSettings()">08:00</div>
        <div class="btn-group">
            <button class="btn" onclick="toggleSettings()">⚙️ Settings</button>
            <button class="btn" onclick="unfollow()">🌍 Free Cam</button>
        </div>
    </div>

    <div id="infoPanel">
        <div style="color:#10b981; font-weight:bold; margin-bottom:5px;">Live Status</div>
        <div id="trainStatusList">Loading...</div>
    </div>

    <!-- Settings Menu -->
    <div id="settingsPanel">
        <div class="set-title">Control Room Settings</div>
        <div class="set-row">
            <span>🌧️ Weather (Rain)</span>
            <label class="switch"><input type="checkbox" id="rainToggle" onchange="toggleRain()"><span class="slider"></span></label>
        </div>
        <div class="set-row">
            <span>⏩ Fast Forward Time</span>
            <label class="switch"><input type="checkbox" id="fastTimeToggle" onchange="toggleFastTime()"><span class="slider"></span></label>
        </div>
        <button class="close-btn" onclick="toggleSettings()">Save & Close</button>
    </div>

    <!-- Mini Map -->
    <div class="minimap-container"><canvas id="minimap"></canvas></div>

    <div class="hint">🔍 Pinch/Scroll to Zoom | 👆 Click Train to Follow | 🗺️ Map Size: 10,000x10,000</div>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const miniCanvas = document.getElementById("minimap");
        const mCtx = miniCanvas.getContext("2d");

        // ==========================================
        // 1. HUGE WORLD & CAMERA (10,000 x 10,000)
        // ==========================================
        const WORLD_SIZE = 10000;
        let cam = { x: 5000, y: 5000, zoom: 0.5 };
        let isDragging = false, startX, startY, camStartX, camStartY;
        let followedTrain = null;
        let isRainy = false;
        let timeSpeedMultiplier = 1;

        function resize() { 
            canvas.width = window.innerWidth; canvas.height = window.innerHeight; 
            miniCanvas.width = 150; miniCanvas.height = 150;
        }
        window.addEventListener('resize', resize); resize();

        // Camera Controls
        canvas.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX; startY = e.clientY; camStartX = cam.x; camStartY = cam.y; followedTrain = null; });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => { if(isDragging) { cam.x = camStartX - (e.clientX - startX)/cam.zoom; cam.y = camStartY - (e.clientY - startY)/cam.zoom; clampCam(); } });
        
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            cam.zoom = Math.min(Math.max(0.15, cam.zoom * (e.deltaY > 0 ? 0.9 : 1.1)), 3.0);
        });

        // Touch Controls
        let initPinch = null, initZoom = null;
        canvas.addEventListener('touchstart', e => {
            if(e.touches.length === 1) { isDragging=true; startX=e.touches[0].clientX; startY=e.touches[0].clientY; camStartX=cam.x; camStartY=cam.y; followedTrain=null; }
            else if(e.touches.length === 2) { initPinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); initZoom = cam.zoom; }
        });
        window.addEventListener('touchend', () => { isDragging = false; initPinch = null; });
        window.addEventListener('touchmove', e => {
            if(e.touches.length === 1 && isDragging && !initPinch) { cam.x = camStartX - (e.touches[0].clientX - startX)/cam.zoom; cam.y = camStartY - (e.touches[0].clientY - startY)/cam.zoom; clampCam(); }
            else if(e.touches.length === 2 && initPinch) {
                let dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
                cam.zoom = Math.min(Math.max(0.15, initZoom * (dist/initPinch)), 3.0);
            }
        });

        function clampCam() {
            cam.x = Math.max(0, Math.min(WORLD_SIZE, cam.x));
            cam.y = Math.max(0, Math.min(WORLD_SIZE, cam.y));
        }

        // Click Train to Follow
        canvas.addEventListener('click', e => {
            if(isDragging) return;
            let wx = (e.clientX - canvas.width/2)/cam.zoom + cam.x;
            let wy = (e.clientY - canvas.height/2)/cam.zoom + cam.y;
            trains.forEach(t => { if(Math.hypot(t.x - wx, t.y - wy) < 150) followedTrain = t; });
        });
        function unfollow() { followedTrain = null; }

        // UI Toggles
        function toggleSettings() { let p = document.getElementById("settingsPanel"); p.style.display = p.style.display === "block" ? "none" : "block"; }
        function toggleRain() { isRainy = document.getElementById("rainToggle").checked; }
        function toggleFastTime() { timeSpeedMultiplier = document.getElementById("fastTimeToggle").checked ? 10 : 1; }

        // ==========================================
        // 2. TIME & DAY/NIGHT CYCLE
        // ==========================================
        let gameTimeMins = 8 * 60; 
        let lastTime = performance.now();
        let isNight = false;

        function updateTime(dt) {
            gameTimeMins += (dt / 1000) * 2 * timeSpeedMultiplier; // 1 real sec = 2 game mins
            if (gameTimeMins >= 24 * 60) gameTimeMins = 0;
            let h = Math.floor(gameTimeMins / 60).toString().padStart(2, '0');
            let m = Math.floor(gameTimeMins % 60).toString().padStart(2, '0');
            document.getElementById("gameClock").innerText = `${h}:${m}`;
            isNight = (gameTimeMins >= 18.5 * 60 || gameTimeMins <= 5.5 * 60);
        }

        // ==========================================
        // 3. GENERATE HUGE ENVIRONMENT
        // ==========================================
        const env = { bldgs: [], trees: [], lakes: [], passengers: [] };
        // Generate thousands of objects but only store coordinates
        for(let i=0; i<800; i++) env.bldgs.push({ x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE, w: 50+Math.random()*100, h: 50+Math.random()*100, c: `hsl(${Math.random()*60+200}, 30%, 30%)` });
        for(let i=0; i<2000; i++) env.trees.push({ x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE, r: 20+Math.random()*20 });
        for(let i=0; i<30; i++) env.lakes.push({ x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE, r: 200+Math.random()*400 });

        // Rain particles
        const rainDrops = [];
        for(let i=0; i<200; i++) rainDrops.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: 15+Math.random()*15 });

        // ==========================================
        // 4. STATIONS, ROADS & GATES (Phatak) 🚧
        // ==========================================
        const stations = [
            { id: "S1", name: "CSMT Main Junction", x: 5000, y: 5000, w: 500, h: 200, c: "#1e293b" },
            { id: "S2", name: "North Industrial", x: 5000, y: 1500, w: 300, h: 150, c: "#334155" },
            { id: "S3", name: "South IT Park", x: 5000, y: 8500, w: 300, h: 150, c: "#334155" },
            { id: "S4", name: "West Valley", x: 1500, y: 5000, w: 150, h: 300, c: "#334155" },
            { id: "S5", name: "East Port (Cargo)", x: 8500, y: 5000, w: 300, h: 300, c: "#0f172a" }
        ];

        // Generate Passengers at stations
        stations.forEach(st => {
            for(let i=0; i<20; i++) env.passengers.push({ st: st.id, x: st.x - st.w/2 + 20 + Math.random()*(st.w-40), y: st.y - st.h/2 + 20 + Math.random()*(st.h-40) });
        });

        // Roads & Level Crossing Gate (Phatak)
        const roads = [ { x: 3000, y1: 0, y2: WORLD_SIZE, gateY: 5000 } ];
        let gateClosed = false;
        let cars = [ { x: 2980, y: 1000, s: 8, c: "white" }, { x: 3010, y: 9000, s: -8, c: "red" }, { x: 2980, y: 4000, s: 6, c: "yellow" } ];

        // ==========================================
        // 5. COMPLEX ROUTES (10,000px Scale)
        // ==========================================
        const routes = {
            mainV: [
                {x: 5000, y: 1500, wait: 3, st: "North Industrial"}, {x: 5000, y: 4950}, 
                {x: 5000, y: 5000, wait: 5, st: "CSMT Main Junction"}, {x: 5000, y: 8500, wait: 3, st: "South IT Park"}, 
                {x: 5100, y: 8500}, {x: 5100, y: 5000, wait: 5, st: "CSMT Main Junction"}, {x: 5100, y: 1500}
            ],
            mainH: [
                {x: 1500, y: 4950, wait: 3, st: "West Valley"}, {x: 3000, y: 4950}, /* Crossing */ 
                {x: 4950, y: 4950}, {x: 5000, y: 4950, wait: 4, st: "CSMT Main Junction"}, 
                {x: 8500, y: 4950, wait: 5, st: "East Port (Cargo)"}, {x: 8500, y: 5050}, 
                {x: 5000, y: 5050, wait: 4, st: "CSMT Main Junction"}, {x: 3000, y: 5050}, {x: 1500, y: 5050}
            ],
            outerRing: [
                {x: 1500, y: 1500}, {x: 8500, y: 1500}, {x: 8500, y: 8500}, {x: 1500, y: 8500}
            ]
        };

        // ==========================================
        // 6. 5 REAL TRAINS 🚇
        // ==========================================
        let trains = [
            { id: "Vande Bharat", c: "#f8fafc", r: routes.mainH, idx: 0, x: 1500, y: 4950, s: 12, max: 12, coach: 8, state: "RUN", wait: 0, a: 0, hist: [], next: "" },
            { id: "Rajdhani Exp", c: "#ef4444", r: routes.mainV, idx: 3, x: 5000, y: 8500, s: 10, max: 10, coach: 12, state: "RUN", wait: 0, a: 0, hist: [], next: "" },
            { id: "Mumbai Local", c: "#3b82f6", r: routes.mainV, idx: 0, x: 5000, y: 1500, s: 7, max: 7, coach: 9, state: "RUN", wait: 0, a: 0, hist: [], next: "" },
            { id: "Indian Cargo", c: "#10b981", r: routes.mainH, idx: 4, x: 8500, y: 4950, s: 5, max: 5, coach: 20, state: "RUN", wait: 0, a: 0, hist: [], next: "" },
            { id: "Metro Rail", c: "#8b5cf6", r: routes.outerRing, idx: 0, x: 1500, y: 1500, s: 9, max: 9, coach: 4, state: "RUN", wait: 0, a: 0, hist: [], next: "" }
        ];

        // ==========================================
        // 7. SMART LOGIC (Anti-Collision, Gates, Cars)
        // ==========================================
        function updateLogic(dt) {
            updateTime(dt);
            if(followedTrain) { cam.x = followedTrain.x; cam.y = followedTrain.y; }

            // Check Phatak (Level Crossing)
            gateClosed = false;
            trains.forEach(t => {
                if(t.r === routes.mainH && Math.abs(t.x - 3000) < 1500) gateClosed = true; // Train near road crossing
            });

            // Car Logic
            cars.forEach(c => {
                let distToGate = Math.abs(c.y - 5000);
                let approaching = (c.s > 0 && c.y < 5000) || (c.s < 0 && c.y > 5000);
                if (gateClosed && approaching && distToGate < 200) { /* Stop */ } 
                else { c.y += c.s * (timeSpeedMultiplier > 1 ? 2 : 1); }
                if(c.y > WORLD_SIZE) c.y = 0; if(c.y < 0) c.y = WORLD_SIZE;
            });

            // Train Anti-Collision & Movement
            let statusHTML = "";
            trains.forEach((t, i) => {
                let target = t.r[(t.idx + 1) % t.r.length];
                t.next = target.st || "En Route";

                if (t.state === "WAITING") {
                    t.wait -= (dt/1000) * 2 * timeSpeedMultiplier;
                    if (t.wait <= 0) { 
                        t.state = "RUN"; t.idx = (t.idx + 1) % t.r.length; 
                        // Horn Effect visually (Remove passengers)
                        env.passengers = env.passengers.filter(p => Math.hypot(p.x - t.x, p.y - t.y) > 300);
                    }
                    statusHTML += `<div>${t.id}: <span style="color:#ef4444">Stopped</span></div>`;
                    return;
                }

                statusHTML += `<div>${t.id}: <span style="color:#10b981">${Math.round(t.s*10)}km/h</span></div>`;

                // Collision Detection (Look ahead 400px)
                let crashRisk = false;
                trains.forEach((t2, j) => {
                    if (i !== j) {
                        let dist = Math.hypot(t.x - t2.x, t.y - t2.y);
                        let angToT2 = Math.atan2(t2.y - t.y, t2.x - t.x);
                        let angDiff = Math.abs(t.a - angToT2);
                        angDiff = Math.atan2(Math.sin(angDiff), Math.cos(angDiff));
                        if (dist < 450 && Math.abs(angDiff) < Math.PI/4) crashRisk = true;
                    }
                });

                if (crashRisk) t.s = Math.max(0, t.s - 0.5); else t.s = Math.min(t.max, t.s + 0.1);
                
                let speedMult = t.s * (timeSpeedMultiplier > 1 ? 2 : 1);
                if (speedMult <= 0) return;

                t.hist.unshift({x: t.x, y: t.y, a: t.a});
                if(t.hist.length > 1000) t.hist.pop();

                let dx = target.x - t.x, dy = target.y - t.y;
                let dist = Math.hypot(dx, dy);

                if (dist < speedMult) {
                    t.x = target.x; t.y = target.y;
                    if (target.st) { t.state = "WAITING"; t.wait = target.wait; } 
                    else { t.idx = (t.idx + 1) % t.r.length; }
                } else {
                    t.a = Math.atan2(dy, dx);
                    t.x += Math.cos(t.a) * speedMult;
                    t.y += Math.sin(t.a) * speedMult;
                }
            });
            document.getElementById("trainStatusList").innerHTML = statusHTML;
        }

        // ==========================================
        // 8. RENDER ENGINE (Culling for performance)
        // ==========================================
        function inView(x, y, padding=500) {
            let left = cam.x - (canvas.width/2)/cam.zoom - padding;
            let right = cam.x + (canvas.width/2)/cam.zoom + padding;
            let top = cam.y - (canvas.height/2)/cam.zoom - padding;
            let bottom = cam.y + (canvas.height/2)/cam.zoom + padding;
            return (x > left && x < right && y > top && y < bottom);
        }

        function drawEnv() {
            ctx.fillStyle = isNight ? "#020617" : "#111827"; ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);
            
            ctx.fillStyle = isNight ? "#0f172a" : "#0284c7";
            env.lakes.forEach(l => { if(inView(l.x, l.y, l.r)) { ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, Math.PI*2); ctx.fill(); }});
            
            env.bldgs.forEach(b => { if(inView(b.x, b.y)) { ctx.fillStyle = isNight ? "#0f172a" : b.c; ctx.fillRect(b.x, b.y, b.w, b.h); if(isNight && b.w>70) { ctx.fillStyle="#fef08a"; ctx.fillRect(b.x+10, b.y+10, 15, 15); } }});
            
            ctx.fillStyle = isNight ? "#064e3b" : "#166534";
            env.trees.forEach(t => { if(inView(t.x, t.y, t.r)) { ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2); ctx.fill(); }});
        }

        function drawInfrastructure() {
            // Roads
            ctx.fillStyle = "#334155"; roads.forEach(r => { if(inView(r.x1, WORLD_SIZE/2, WORLD_SIZE)) ctx.fillRect(r.x1-30, r.y1, 60, r.y2); });
            
            // Level Crossing (Phatak) 🚧
            ctx.fillStyle = "#cbd5e1"; ctx.fillRect(2970, 4950, 60, 100); // Zebra
            ctx.fillStyle = "#000"; ctx.fillRect(2960, 4900, 10, 20); ctx.fillRect(3030, 4900, 10, 20); // Pillars
            ctx.fillStyle = gateClosed ? "#ef4444" : "#10b981"; // Signal Lights
            ctx.beginPath(); ctx.arc(2965, 4910, 5, 0, Math.PI*2); ctx.arc(3035, 4910, 5, 0, Math.PI*2); ctx.fill();
            if(gateClosed) { ctx.fillStyle="#f59e0b"; ctx.fillRect(2970, 4915, 60, 5); } // Boom barrier down

            // Tracks
            Object.values(routes).forEach(route => {
                ctx.beginPath(); ctx.strokeStyle = "#475569"; ctx.lineWidth = 14; ctx.setLineDash([6, 12]);
                ctx.moveTo(route[0].x, route[0].y); for(let i=1; i<route.length; i++) ctx.lineTo(route[i].x, route[i].y); ctx.stroke();
                ctx.beginPath(); ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 18; ctx.setLineDash([]);
                ctx.moveTo(route[0].x, route[0].y); for(let i=1; i<route.length; i++) ctx.lineTo(route[i].x, route[i].y); ctx.stroke();
                ctx.beginPath(); ctx.strokeStyle = isNight ? "#020617" : "#111827"; ctx.lineWidth = 12;
                ctx.moveTo(route[0].x, route[0].y); for(let i=1; i<route.length; i++) ctx.lineTo(route[i].x, route[i].y); ctx.stroke();
            });

            // Stations & Passengers 🧍
            stations.forEach(st => {
                if(inView(st.x, st.y, Math.max(st.w, st.h))) {
                    ctx.fillStyle = st.c; ctx.fillRect(st.x - st.w/2, st.y - st.h/2, st.w, st.h);
                    ctx.fillStyle = "#fff"; ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center"; ctx.fillText(st.name, st.x, st.y - st.h/2 - 20);
                }
            });
            ctx.fillStyle = "#f8fafc";
            env.passengers.forEach(p => { if(inView(p.x, p.y)) { ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill(); }});

            // Cars
            cars.forEach(c => { if(inView(c.x, c.y)) { ctx.fillStyle = c.c; ctx.fillRect(c.x, c.y, 16, 30); if(isNight) { ctx.fillStyle="rgba(255,255,200,0.4)"; ctx.beginPath(); if(c.s>0) ctx.arc(c.x+8, c.y+40, 25, 0, Math.PI); else ctx.arc(c.x+8, c.y-10, 25, Math.PI, 0); ctx.fill(); } }});
        }

        function drawTrains() {
            const C_LEN = 55, C_GAP = 6;
            trains.forEach(t => {
                if(!inView(t.x, t.y, 2000)) return; // Cull if far away
                
                // Track Signals 🚥
                ctx.fillStyle = "#000"; ctx.fillRect(t.x + 30, t.y - 30, 10, 20);
                ctx.fillStyle = (t.s < t.max/2) ? "#ef4444" : "#10b981"; ctx.beginPath(); ctx.arc(t.x + 35, t.y - 20, 4, 0, Math.PI*2); ctx.fill();

                // Engine
                ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.a);
                ctx.fillStyle = (t.id === "Vande Bharat") ? "#fff" : t.c; ctx.fillRect(-C_LEN/2, -14, C_LEN, 28);
                if(isNight) { let grad = ctx.createLinearGradient(C_LEN/2, 0, C_LEN/2+300, 0); grad.addColorStop(0, "rgba(255,255,200,0.7)"); grad.addColorStop(1, "rgba(255,255,200,0)"); ctx.fillStyle = grad; ctx.beginPath(); ctx.moveTo(C_LEN/2, -12); ctx.lineTo(C_LEN/2+300, -80); ctx.lineTo(C_LEN/2+300, 80); ctx.lineTo(C_LEN/2, 12); ctx.fill(); }
                ctx.restore();

                // Coaches
                for (let i = 1; i <= t.coach; i++) {
                    let hIdx = Math.floor((i * (C_LEN + C_GAP)) / Math.max(t.s, 1));
                    if (hIdx < t.hist.length) {
                        let pos = t.hist[hIdx];
                        ctx.save(); ctx.translate(pos.x, pos.y); ctx.rotate(pos.a);
                        ctx.fillStyle = t.c; ctx.fillRect(-C_LEN/2, -14, C_LEN, 28);
                        ctx.fillStyle = "#000"; ctx.fillRect(-C_LEN/2 + 5, -10, C_LEN-10, 20);
                        ctx.restore();
                    }
                }

                // ID text
                ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(t.id, t.x, t.y - 40);
                
                // Visual Horn 🔊
                if(t.state === "RUN" && t.wait > -2) { ctx.fillStyle = "#f59e0b"; ctx.fillText("🔊 POOOONG!", t.x, t.y - 60); }
            });
        }

        // ==========================================
        // 9. MINIMAP / RADAR 🗺️
        // ==========================================
        function drawMiniMap() {
            mCtx.clearRect(0,0,150,150);
            let scale = 150 / WORLD_SIZE;
            
            // Draw tracks on minimap
            mCtx.strokeStyle = "rgba(255,255,255,0.2)"; mCtx.lineWidth = 1;
            Object.values(routes).forEach(route => { mCtx.beginPath(); mCtx.moveTo(route[0].x*scale, route[0].y*scale); for(let i=1; i<route.length; i++) mCtx.lineTo(route[i].x*scale, route[i].y*scale); mCtx.stroke(); });

            // Draw Trains
            trains.forEach(t => { mCtx.fillStyle = t.c; mCtx.beginPath(); mCtx.arc(t.x*scale, t.y*scale, 3, 0, Math.PI*2); mCtx.fill(); });
            
            // Draw Camera Viewport Box
            mCtx.strokeStyle = "#f59e0b"; mCtx.lineWidth = 1.5;
            let vW = (canvas.width/cam.zoom)*scale, vH = (canvas.height/cam.zoom)*scale;
            mCtx.strokeRect((cam.x*scale) - vW/2, (cam.y*scale) - vH/2, vW, vH);
        }

        // ==========================================
        // 10. MAIN ANIMATION LOOP
        // ==========================================
        function animate(time) {
            let dt = time - lastTime; lastTime = time;
            updateLogic(dt);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-cam.x, -cam.y);
            
            drawEnv(); drawInfrastructure(); drawTrains();
            
            // Rain 🌧️
            if(isRainy) {
                ctx.fillStyle = "rgba(255,255,255,0.4)";
                rainDrops.forEach(r => { 
                    let rx = cam.x - (canvas.width/2)/cam.zoom + r.x/cam.zoom;
                    let ry = cam.y - (canvas.height/2)/cam.zoom + r.y/cam.zoom;
                    ctx.fillRect(rx, ry, 2, r.s); 
                    r.y += 20; if(r.y > canvas.height) { r.y = 0; r.x = Math.random()*canvas.width; }
                });
            }

            if(isNight) { ctx.fillStyle = "rgba(0, 5, 20, 0.5)"; ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE); }

            ctx.restore();
            drawMiniMap();
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
