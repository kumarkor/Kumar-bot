<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mega Smart Railway Junction</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { 
            background: #11141a; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Disable browser scrolling */
        }
        
        canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
        canvas:active { cursor: grabbing; }

        /* UI Overlay */
        .ui-panel {
            position: absolute; top: 15px; left: 15px;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px);
            color: #fff; padding: 15px 20px; border-radius: 12px; 
            border: 1px solid #334155; pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .ui-title { font-size: 18px; font-weight: 800; color: #38bdf8; margin-bottom: 5px; }
        .ui-subtitle { font-size: 11px; color: #94a3b8; margin-bottom: 15px; }
        
        /* Game Clock */
        .clock-box {
            background: #000; border: 2px solid #10b981; color: #10b981;
            padding: 8px 15px; border-radius: 8px; font-family: monospace;
            font-size: 22px; font-weight: bold; text-align: center; letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .legend { font-size: 11px; font-weight: 600; }
        .legend-item { display: flex; align-items: center; margin-top: 8px; }
        .box { width: 14px; height: 14px; margin-right: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); }

        .hint {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: #fcd34d; padding: 8px 15px;
            border-radius: 20px; font-size: 12px; font-weight: bold; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="ui-panel">
        <div class="ui-title">🚆 Smart City Railway</div>
        <div class="ui-subtitle">Simulation: 1 Real Sec = 1 In-Game Min</div>
        
        <!-- Live Clock -->
        <div class="clock-box" id="gameClock">08:00</div>

        <div class="legend">
            <div class="legend-item"><div class="box" style="background: #ef4444;"></div> Express (Red)</div>
            <div class="legend-item"><div class="box" style="background: #3b82f6;"></div> Local Train (Blue)</div>
            <div class="legend-item"><div class="box" style="background: #10b981;"></div> Mal Gadi / Cargo (Green)</div>
        </div>
    </div>

    <div class="hint">👈 Drag to explore the HUGE map 👉</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // ==========================================
        // 1. CAMERA & HUGE MAP LOGIC (Pan system)
        // ==========================================
        let camera = { x: -500, y: -500, zoom: 1 };
        let isDragging = false, startX, startY, camStartX, camStartY;

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        // Mouse Events
        canvas.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX; startY = e.clientY; camStartX = camera.x; camStartY = camera.y; });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => { if (isDragging) { camera.x = camStartX + (e.clientX - startX); camera.y = camStartY + (e.clientY - startY); } });

        // Touch Events
        canvas.addEventListener('touchstart', e => { isDragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY; camStartX = camera.x; camStartY = camera.y; });
        window.addEventListener('touchend', () => isDragging = false);
        window.addEventListener('touchmove', e => { if (isDragging) { camera.x = camStartX + (e.touches[0].clientX - startX); camera.y = camStartY + (e.touches[0].clientY - startY); } });

        // ==========================================
        // 2. TIME SYSTEM (1 Sec = 1 Min)
        // ==========================================
        let gameTimeInMinutes = 8 * 60; // Starts at 08:00 AM
        let lastFrameTime = performance.now();

        function updateClock(deltaTimeMs) {
            // 1000 ms (1 sec) = 1 minute game time
            gameTimeInMinutes += (deltaTimeMs / 1000); 
            if (gameTimeInMinutes >= 24 * 60) gameTimeInMinutes = 0; // Reset after 24 hrs
            
            let hours = Math.floor(gameTimeInMinutes / 60).toString().padStart(2, '0');
            let mins = Math.floor(gameTimeInMinutes % 60).toString().padStart(2, '0');
            document.getElementById("gameClock").innerText = `${hours}:${mins}`;
        }

        // ==========================================
        // 3. MAP ROUTES & STATIONS (Waypoints)
        // ==========================================
        const stations = [
            { id: "S1", name: "Central Junction", x: 2000, y: 1930, w: 200, h: 140, color: "#334155" },
            { id: "S2", name: "West City", x: 500, y: 1980, w: 150, h: 80, color: "#334155" },
            { id: "S3", name: "East Port", x: 3500, y: 1980, w: 150, h: 80, color: "#334155" },
            { id: "S4", name: "North Valley", x: 1980, y: 500, w: 80, h: 150, color: "#334155" },
            { id: "S5", name: "Cargo Hub", x: 3500, y: 2200, w: 250, h: 100, color: "#1e293b" }
        ];

        // Routes are array of connected coordinates. trains will follow these perfectly.
        const routes = {
            // Local (Blue) - East/West Loop
            local: [
                {x: 500, y: 2050, wait: 2}, {x: 1800, y: 2050}, {x: 2000, y: 2050, wait: 3}, // Stop at Central
                {x: 3500, y: 2050, wait: 2}, {x: 3500, y: 1950}, // Loop around East
                {x: 2000, y: 1950, wait: 3}, {x: 500, y: 1950}, {x: 500, y: 2050} // Loop back West
            ],
            // Express (Red) - North/South Loop
            express: [
                {x: 1950, y: 500, wait: 2}, {x: 1950, y: 1800}, {x: 1950, y: 2000, wait: 3}, // Stop Central
                {x: 1950, y: 3500}, {x: 2050, y: 3500}, // Loop South
                {x: 2050, y: 2000, wait: 3}, {x: 2050, y: 500}, {x: 1950, y: 500} // Loop North
            ],
            // Mal Gadi (Green) - Merges into local track, goes to cargo hub
            cargo: [
                {x: 500, y: 2120}, {x: 1700, y: 2120}, 
                {x: 1800, y: 2050}, // Merge into Local Track!
                {x: 2200, y: 2050}, // Leave Local Track
                {x: 2300, y: 2120}, {x: 3500, y: 2120}, {x: 3500, y: 2250, wait: 5}, // Stop at Cargo Hub
                {x: 3500, y: 2300}, {x: 500, y: 2300}, {x: 500, y: 2120} // Outer loop back
            ]
        };

        // ==========================================
        // 4. TRAINS DATA
        // ==========================================
        let trains = [
            { id: "T1", type: "Local", color: "#3b82f6", route: routes.local, rIdx: 0, x: 500, y: 2050, speed: 4, baseSpeed: 4, coaches: 4, state: "RUNNING", waitTime: 0, angle: 0, history: [] },
            { id: "T2", type: "Express", color: "#ef4444", route: routes.express, rIdx: 0, x: 1950, y: 500, speed: 5, baseSpeed: 5, coaches: 6, state: "RUNNING", waitTime: 0, angle: 0, history: [] },
            { id: "T3", type: "Cargo", color: "#10b981", route: routes.cargo, rIdx: 0, x: 500, y: 2120, speed: 3, baseSpeed: 3, coaches: 12, state: "RUNNING", waitTime: 0, angle: 0, history: [] }
        ];

        const COACH_LEN = 40;
        const COACH_GAP = 5;

        // ==========================================
        // 5. DRAW ENVIRONMENT
        // ==========================================
        function drawTracksAndStations() {
            // Draw Stations
            stations.forEach(st => {
                ctx.fillStyle = st.color;
                ctx.fillRect(st.x - st.w/2, st.y - st.h/2, st.w, st.h);
                ctx.strokeStyle = "#475569"; ctx.lineWidth = 4; ctx.strokeRect(st.x - st.w/2, st.y - st.h/2, st.w, st.h);
                ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(st.name, st.x, st.y - st.h/2 - 10);
            });

            // Draw Tracks based on routes
            ctx.lineJoin = "round"; ctx.lineCap = "round";
            Object.values(routes).forEach(route => {
                // Sleepers (Dashed background)
                ctx.beginPath(); ctx.strokeStyle = "#475569"; ctx.lineWidth = 14; ctx.setLineDash([4, 8]);
                ctx.moveTo(route[0].x, route[0].y);
                for(let i=1; i<route.length; i++) ctx.lineTo(route[i].x, route[i].y);
                ctx.stroke();

                // Steel Rails (Solid lines)
                ctx.beginPath(); ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 18; ctx.setLineDash([]);
                ctx.moveTo(route[0].x, route[0].y);
                for(let i=1; i<route.length; i++) ctx.lineTo(route[i].x, route[i].y);
                
                // Track inner fill to make two rails
                ctx.stroke();
                ctx.beginPath(); ctx.strokeStyle = "#11141a"; ctx.lineWidth = 12;
                ctx.moveTo(route[0].x, route[0].y);
                for(let i=1; i<route.length; i++) ctx.lineTo(route[i].x, route[i].y);
                ctx.stroke();
            });
        }

        // ==========================================
        // 6. SMART ANTI-COLLISION & MOVEMENT LOGIC
        // ==========================================
        function getDistance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

        function checkCollisions() {
            for (let i = 0; i < trains.length; i++) {
                let t1 = trains[i];
                let shouldStop = false;

                if (t1.state === "WAITING") continue; // Already stopped at station

                for (let j = 0; j < trains.length; j++) {
                    if (i === j) continue;
                    let t2 = trains[j];
                    
                    let dist = getDistance(t1.x, t1.y, t2.x, t2.y);
                    
                    // जर दुसरी ट्रेन 250px च्या आत असेल, तर ती समोर आहे का ते तपासा (Angle Cone)
                    if (dist < 250) {
                        let angleToT2 = Math.atan2(t2.y - t1.y, t2.x - t1.x);
                        let angleDiff = Math.abs(t1.angle - angleToT2);
                        // Normalize angle to -PI to PI
                        angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));

                        // जर दुसरी ट्रेन समोरच्या 45-degree च्या Cone मध्ये असेल (म्हणजे समोर ट्रॅक क्रॉस करत असेल किंवा पुढे असेल)
                        if (Math.abs(angleDiff) < Math.PI / 4) {
                            shouldStop = true;
                        }
                    }
                }
                
                // ब्रेक मारणे किंवा पुढे जाणे
                if (shouldStop) {
                    t1.speed = Math.max(0, t1.speed - 0.2); // Smooth brake
                } else {
                    t1.speed = Math.min(t1.baseSpeed, t1.speed + 0.1); // Smooth acceleration
                }
            }
        }

        function updateTrains(deltaTimeMs) {
            checkCollisions(); // अपघातापासून वाचवा!

            trains.forEach(t => {
                if (t.state === "WAITING") {
                    t.waitTime -= (deltaTimeMs / 1000); // 1 sec = 1 min
                    if (t.waitTime <= 0) {
                        t.state = "RUNNING";
                        t.rIdx = (t.rIdx + 1) % t.route.length; // Next waypoint
                    }
                    return;
                }

                if (t.speed <= 0) return; // Signal stop

                // Save history for trailing coaches
                t.history.unshift({ x: t.x, y: t.y, angle: t.angle });
                if (t.history.length > 500) t.history.pop(); // Memory save

                // Move towards next waypoint
                let target = t.route[(t.rIdx + 1) % t.route.length];
                let dx = target.x - t.x;
                let dy = target.y - t.y;
                let dist = Math.hypot(dx, dy);

                if (dist < t.speed) {
                    // Reached Waypoint!
                    t.x = target.x; t.y = target.y;
                    
                    if (target.wait) {
                        t.state = "WAITING";
                        t.waitTime = target.wait; // Wait for 'X' game minutes
                    } else {
                        t.rIdx = (t.rIdx + 1) % t.route.length;
                    }
                } else {
                    // Moving
                    t.angle = Math.atan2(dy, dx);
                    t.x += Math.cos(t.angle) * t.speed;
                    t.y += Math.sin(t.angle) * t.speed;
                }
            });
        }

        function drawTrain(t) {
            // Draw Engine
            ctx.save();
            ctx.translate(t.x, t.y);
            ctx.rotate(t.angle);
            ctx.fillStyle = "#f8fafc"; // White Engine head
            ctx.fillRect(-COACH_LEN/2, -10, COACH_LEN, 20);
            ctx.fillStyle = "#fbbf24"; ctx.fillRect(COACH_LEN/2 - 5, -5, 5, 10); // Headlight
            ctx.restore();

            // Draw Coaches (Snaking effect using History array)
            for (let i = 1; i <= t.coaches; i++) {
                // Calculate history index based on speed and distance
                let histIdx = Math.floor((i * (COACH_LEN + COACH_GAP)) / Math.max(t.baseSpeed, 1));
                
                if (histIdx < t.history.length) {
                    let pos = t.history[histIdx];
                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.rotate(pos.angle);
                    
                    ctx.fillStyle = t.color;
                    ctx.fillRect(-COACH_LEN/2, -10, COACH_LEN, 20);
                    // Windows
                    ctx.fillStyle = "#1e293b";
                    ctx.fillRect(-COACH_LEN/2 + 5, -6, COACH_LEN - 10, 12);
                    
                    ctx.restore();
                }
            }

            // Status Text (Waiting/Moving) above engine
            if(t.state === "WAITING") {
                ctx.fillStyle = "#fbbf24"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(`Wait: ${Math.ceil(t.waitTime)}m`, t.x, t.y - 20);
            }
        }

        // ==========================================
        // 7. MAIN ENGINE LOOP
        // ==========================================
        function animate(time) {
            let deltaTime = time - lastFrameTime;
            lastFrameTime = time;

            // Update Logic
            updateClock(deltaTime);
            updateTrains(deltaTime);

            // Draw Graphics
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(camera.x, camera.y); // Apply Pan Camera
            
            drawTracksAndStations(); // Background map
            trains.forEach(drawTrain); // Trains on top

            ctx.restore(); // Reset camera for UI overlay
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
