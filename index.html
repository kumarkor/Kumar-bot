<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Realistic Train Simulation</title>
    <style>
        /* =========================================
           UI & BACKGROUND
        ========================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f172a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: sans-serif;
        }
        
        canvas { 
            background: linear-gradient(to bottom, #111, #222); 
            max-width: 450px; 
            width: 100%; 
            height: 100vh; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .hint-text {
            position: absolute;
            top: 40px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            letter-spacing: 1px;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="hint-text">👈 Tap Left &nbsp;|&nbsp; Tap Right 👉</div>
    <canvas id="trainCanvas"></canvas>

    <script>
        const canvas = document.getElementById("trainCanvas");
        const ctx = canvas.getContext("2d");

        // कॅन्व्हसची साईझ सेट करणे
        function resize() {
            canvas.width = Math.min(window.innerWidth, 450);
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ----------------------------------------
        // Variables (ट्रेन आणि ट्रॅकची माहिती)
        // ----------------------------------------
        const lanes = 3; // ३ रुळ
        let currentLane = 1; // ट्रेन सुरुवातीला मधल्या रुळावर (0, 1, 2)
        let trackOffset = 0; // रुळ पळण्यासाठी
        const trainSpeed = 12; // ट्रेनचा स्पीड (रुळ मागे जाण्याचा वेग)
        
        const trainW = 60; // ट्रेनची रुंदी
        const trainH = 120; // ट्रेनची लांबी
        let trainX = 0; // ट्रेनची जागा (X-axis)

        // रुळाचा मध्यभाग शोधणे
        function getLaneCenter(laneIndex) {
            const laneWidth = canvas.width / lanes;
            return (laneIndex * laneWidth) + (laneWidth / 2);
        }

        // ----------------------------------------
        // १. पळणारे रुळ काढणे (Draw Tracks)
        // ----------------------------------------
        function drawTracks() {
            const laneWidth = canvas.width / lanes;
            
            // उभ्या लाईन्स (Tracks)
            ctx.strokeStyle = "#475569";
            ctx.lineWidth = 4;
            for (let i = 1; i < lanes; i++) {
                ctx.beginPath();
                ctx.moveTo(i * laneWidth, 0);
                ctx.lineTo(i * laneWidth, canvas.height);
                ctx.stroke();
            }

            // आडव्या लाईन्स (Sleepers) ज्या मागे पळतात
            trackOffset += trainSpeed;
            if (trackOffset > 80) trackOffset = 0;
            
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 8;
            for (let y = trackOffset - 80; y < canvas.height; y += 80) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // ----------------------------------------
        // २. ट्रेन काढणे आणि स्मूथ सरकवणे
        // ----------------------------------------
        function drawTrain() {
            // ✨ इथं आहे ती जादू: ट्रेनला एका रुळावरून दुसऱ्या रुळावर स्मूथली (Animation) सरकवणे
            let targetX = getLaneCenter(currentLane) - (trainW / 2);
            trainX += (targetX - trainX) * 0.15; // 0.15 मुळे ट्रेन हळूवार स्लाइड होते
            
            let trainY = canvas.height - trainH - 60; // ट्रेन स्क्रीनच्या खाली असेल

            // ट्रेनचा मुख्य डबा
            ctx.fillStyle = "#38bdf8"; 
            ctx.beginPath();
            ctx.roundRect(trainX, trainY, trainW, trainH, 10);
            ctx.fill();
            
            // ट्रेनचं छत (Roof effect)
            ctx.fillStyle = "#0284c7";
            ctx.fillRect(trainX + 8, trainY, trainW - 16, trainH);
            
            // ड्रायव्हरची काच (Window)
            ctx.fillStyle = "#e0f2fe";
            ctx.beginPath();
            ctx.roundRect(trainX + 12, trainY + 25, trainW - 24, 35, 5);
            ctx.fill();
            
            // पिवळा हेडलाईट (Headlight)
            ctx.fillStyle = "#fbbf24";
            ctx.beginPath();
            ctx.arc(trainX + trainW / 2, trainY + 10, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // हेडलाईटचा प्रकाश (Glow Effect)
            let gradient = ctx.createRadialGradient(trainX + trainW/2, trainY+10, 5, trainX + trainW/2, trainY - 80, 60);
            gradient.addColorStop(0, "rgba(251, 191, 36, 0.6)");
            gradient.addColorStop(1, "rgba(251, 191, 36, 0)");
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(trainX + trainW/2 - 10, trainY + 10);
            ctx.lineTo(trainX + trainW/2 - 50, trainY - 80);
            ctx.lineTo(trainX + trainW/2 + 50, trainY - 80);
            ctx.lineTo(trainX + trainW/2 + 10, trainY + 10);
            ctx.fill();
        }

        // ----------------------------------------
        // ३. मुख्य ॲनिमेशन लूप (Main Engine)
        // ----------------------------------------
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTracks();
            drawTrain();
            requestAnimationFrame(animate);
        }

        // ----------------------------------------
        // ४. कंट्रोल्स (स्क्रीनवर टॅप केल्यावर ट्रॅक बदलणे)
        // ----------------------------------------
        function changeTrack(clientX) {
            let rect = canvas.getBoundingClientRect();
            let clickX = clientX - rect.left;
            
            // डावीकडे दाबलं तर डावीकडे, उजवीकडे दाबलं तर उजवीकडे
            if (clickX < canvas.width / 2 && currentLane > 0) {
                currentLane--;
            } else if (clickX >= canvas.width / 2 && currentLane < lanes - 1) {
                currentLane++;
            }
        }

        // मोबाईलसाठी (Touch)
        window.addEventListener("touchstart", (e) => changeTrack(e.touches[0].clientX));
        // कॉम्प्युटरसाठी (Mouse Click)
        window.addEventListener("mousedown", (e) => changeTrack(e.clientX));
        // कीबोर्डसाठी (Arrow Keys)
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" && currentLane > 0) currentLane--;
            if (e.key === "ArrowRight" && currentLane < lanes - 1) currentLane++;
        });

        // ट्रेनची सुरुवातीची जागा सेट करणे आणि इंजिन चालू करणे
        trainX = getLaneCenter(currentLane) - (trainW / 2);
        animate();

    </script>
</body>
</html>
