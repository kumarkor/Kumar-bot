<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultra Gaming Hub</title>
    
    <!-- 🔗 ही लिंक ॲप डाऊनलोड करण्यासाठी महत्त्वाची आहे -->
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 450px; background: #1e293b; display: flex; flex-direction: column; height: 100%; position: relative; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #0f172a; border-bottom: 2px solid #334155; }
        .logo { font-size: 18px; font-weight: 800; color: #38bdf8; }
        .coin-box { background: linear-gradient(90deg, #f59e0b, #d97706); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; }

        .screen { display: none; flex: 1; overflow-y: auto; padding: 20px; }
        .screen.active { display: block; }

        /* Install App Button */
        #installAppBtn { display: none; width: 100%; background: linear-gradient(90deg, #10b981, #059669); color: white; padding: 15px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; margin-bottom: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        
        .section-title { font-size: 18px; font-weight: 800; margin-bottom: 15px; border-left: 4px solid #38bdf8; padding-left: 10px; }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .game-card { background: #334155; border-radius: 16px; overflow: hidden; cursor: pointer; text-align: center; border: 1px solid #475569; position: relative; }
        .game-thumb { height: 90px; display: flex; justify-content: center; align-items: center; font-size: 35px; }
        .game-info { padding: 10px; }
        .game-title { font-size: 13px; font-weight: bold; }
        
        /* High Score Badge */
        .high-score-badge { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); font-size: 10px; padding: 2px 6px; border-radius: 8px; color: #f59e0b; font-weight: bold; }

        .nav-bar { display: flex; justify-content: space-around; background: #0f172a; padding: 15px 0; border-top: 2px solid #334155; }
        .nav-btn { color: #94a3b8; font-size: 12px; font-weight: bold; cursor: pointer; }
        .nav-btn.active { color: #38bdf8; }

        /* Game Screen */
        #gamePlayScreen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; flex-direction: column; }
        .game-top { display: flex; justify-content: space-between; padding: 15px; background: rgba(0,0,0,0.8); }
        canvas { flex: 1; width: 100%; }
        
        #countdownOverlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 200; display: none; justify-content: center; align-items: center; }
        .count-text { font-family: 'Press Start 2P'; font-size: 60px; color: #38bdf8; }

        #gameOverOverlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 150; display: none; justify-content: center; align-items: center; flex-direction: column; }
        .btn-action { background: #38bdf8; color: #fff; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 10px; width: 200px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-bar">
            <div class="logo">⚡ ARCADE HUB</div>
            <div class="coin-box">🟡 <span id="userCoins">0</span></div>
        </div>

        <div id="hubScreen" class="screen active">
            <!-- 📲 INSTALL BUTTON -->
            <button id="installAppBtn" onclick="installPWA()">📲 INSTALL APP TO DEVICE</button>
            
            <div class="section-title">Play & Earn</div>
            <div class="game-grid">
                <div class="game-card" onclick="initGame('train')">
                    <div class="high-score-badge">🏆 <span id="hs_train">0</span></div>
                    <div class="game-thumb" style="background: #e94560;">🚂</div>
                    <div class="game-info"><div class="game-title">Train Rush</div></div>
                </div>
                <div class="game-card" onclick="initGame('rocket')">
                    <div class="high-score-badge">🏆 <span id="hs_rocket">0</span></div>
                    <div class="game-thumb" style="background: #8e2de2;">🚀</div>
                    <div class="game-info"><div class="game-title">Galaxy Fly</div></div>
                </div>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-btn active">🎮 Games</div>
        </div>

        <!-- GAME PLAY AREA -->
        <div id="gamePlayScreen">
            <div class="game-top">
                <div style="font-family:'Press Start 2P'; font-size:12px; color:#f59e0b;">SCORE: <span id="liveScore">0</span></div>
                <button style="background:#ef4444; color:#fff; border:none; padding:5px 15px; border-radius:10px;" onclick="exitGame()">EXIT</button>
            </div>
            <canvas id="mainCanvas"></canvas>

            <div id="countdownOverlay"><div class="count-text" id="countText">3</div></div>
            
            <div id="gameOverOverlay">
                <div style="font-family:'Press Start 2P'; font-size:20px; color:#ef4444; margin-bottom:15px;">CRASHED!</div>
                <div style="font-size:18px; color:#fff; margin-bottom:5px;">Score: <span id="goScore">0</span></div>
                <div style="font-size:14px; color:#f59e0b; margin-bottom:20px; font-weight:bold;">🏆 High Score: <span id="goHighScore">0</span></div>
                <div style="font-size:16px; color:#10b981; margin-bottom:20px; font-weight:bold;">Earned +<span id="goCoins">0</span> Coins 🟡</div>
                
                <button class="btn-action" onclick="restartCurrentGame()">Play Again</button>
                <button class="btn-action" style="background:#475569;" onclick="exitGame()">Back to Hub</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. PWA INSTALL LOGIC (Download Button)
        // ==========================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("Service Worker Active"));
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installAppBtn').style.display = 'block'; // Show Install Button
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choice) => {
                    if (choice.outcome === 'accepted') {
                        document.getElementById('installAppBtn').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }

        // ==========================================
        // 2. STORAGE LOGIC (Coins & High Scores)
        // ==========================================
        let myCoins = parseInt(localStorage.getItem('megaHubCoins')) || 0;
        document.getElementById('userCoins').innerText = myCoins;
        
        let highScores = JSON.parse(localStorage.getItem('megaHubScores')) || { train: 0, rocket: 0 };
        document.getElementById('hs_train').innerText = highScores.train;
        document.getElementById('hs_rocket').innerText = highScores.rocket;

        function updateCoins(amount) {
            myCoins += amount;
            localStorage.setItem('megaHubCoins', myCoins);
            document.getElementById('userCoins').innerText = myCoins;
        }

        function checkHighScore(gameId, currentScore) {
            if(currentScore > highScores[gameId]) {
                highScores[gameId] = currentScore;
                localStorage.setItem('megaHubScores', JSON.stringify(highScores));
                document.getElementById('hs_' + gameId).innerText = highScores[gameId];
            }
            return highScores[gameId];
        }

        // ==========================================
        // 3. GAME ENGINE
        // ==========================================
        const canvas = document.getElementById("mainCanvas");
        const ctx = canvas.getContext("2d");
        
        let currentGame = "", gameLoopReq, isGameRunning = false;
        let gScore = 0, gFrames = 0, gSpeed = 5;
        let player = {}, entities = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight - 60; }
        window.addEventListener('resize', resizeCanvas);

        function initGame(gameId) {
            currentGame = gameId;
            document.getElementById('gamePlayScreen').style.display = 'flex';
            document.getElementById('gameOverOverlay').style.display = 'none';
            document.getElementById('liveScore').innerText = "0";
            resizeCanvas(); startCountdown();
        }

        function startCountdown() {
            const overlay = document.getElementById('countdownOverlay');
            const txt = document.getElementById('countText');
            overlay.style.display = 'flex';
            let count = 3; txt.innerText = count;
            
            let timer = setInterval(() => {
                count--;
                if(count > 0) txt.innerText = count;
                else if(count === 0) txt.innerText = "GO!";
                else { clearInterval(timer); overlay.style.display = 'none'; startGameEngine(); }
            }, 1000);
        }

        function startGameEngine() {
            isGameRunning = true; gScore = 0; gFrames = 0; entities = [];
            if(currentGame === 'train') { player = { lane: 1, w: 40, h: 70, y: canvas.height - 90 }; gSpeed = 6; }
            if(currentGame === 'rocket') { player = { y: canvas.height/2, v: 0, g: 0.6, jump: -8, r: 15 }; }
            runGameLoop();
        }

        function runGameLoop() {
            if(!isGameRunning) return;
            ctx.clearRect(0,0,canvas.width, canvas.height);
            gFrames++;

            if(currentGame === 'train') loopTrain();
            else if(currentGame === 'rocket') loopRocket();

            document.getElementById('liveScore').innerText = gScore;
            gameLoopReq = requestAnimationFrame(runGameLoop);
        }

        function gameOver() {
            isGameRunning = false; cancelAnimationFrame(gameLoopReq);
            
            let coinsEarned = Math.floor(gScore / 10);
            let bestScore = checkHighScore(currentGame, gScore); // Save High Score

            document.getElementById('goScore').innerText = gScore;
            document.getElementById('goHighScore').innerText = bestScore;
            document.getElementById('goCoins').innerText = coinsEarned;
            document.getElementById('gameOverOverlay').style.display = 'flex';
            
            if(coinsEarned > 0) updateCoins(coinsEarned);
        }

        function exitGame() { isGameRunning = false; cancelAnimationFrame(gameLoopReq); document.getElementById('gamePlayScreen').style.display = 'none'; }
        function restartCurrentGame() { document.getElementById('gameOverOverlay').style.display = 'none'; startCountdown(); }

        // --- TRAIN RUSH LOGIC ---
        function loopTrain() {
            const laneW = canvas.width/3; const lanes = [laneW/2, laneW + laneW/2, laneW*2 + laneW/2];
            ctx.strokeStyle = "#334155"; ctx.lineWidth = 2;
            for(let i=1; i<3; i++) { ctx.beginPath(); ctx.moveTo(i*laneW, 0); ctx.lineTo(i*laneW, canvas.height); ctx.stroke(); }
            
            let px = lanes[player.lane] - player.w/2;
            ctx.fillStyle = "#38bdf8"; ctx.fillRect(px, player.y, player.w, player.h);

            if(gFrames % 40 === 0) entities.push({ l: Math.floor(Math.random()*3), y: -50, type: Math.random()>0.7?'coin':'box', passed:false });
            
            for(let i=0; i<entities.length; i++) {
                let e = entities[i]; e.y += gSpeed; let ex = lanes[e.l] - 20;
                
                if(e.type === 'box') { ctx.fillStyle = "#ef4444"; ctx.fillRect(ex, e.y, 40, 50); }
                else { ctx.fillStyle = "#f59e0b"; ctx.beginPath(); ctx.arc(ex+20, e.y+20, 15, 0, Math.PI*2); ctx.fill(); }

                if(e.l === player.lane && e.y+40 > player.y && e.y < player.y+player.h) {
                    if(e.type === 'box') gameOver(); else { gScore+=50; entities.splice(i,1); i--; }
                }
                else if(e.y > canvas.height) { 
                    if(e.type==='box' && !e.passed) { e.passed=true; gScore+=10; gSpeed+=0.05; }
                    if(e.y > canvas.height+50) { entities.splice(i,1); i--; }
                }
            }
        }

        // --- GALAXY ROCKET LOGIC ---
        function loopRocket() {
            player.v += player.g; player.y += player.v;
            ctx.fillStyle = "#f43f5e"; ctx.beginPath(); ctx.arc(canvas.width/3, player.y, player.r, 0, Math.PI*2); ctx.fill();

            if(gFrames % 80 === 0) {
                let gap = 150; let topH = Math.random()*(canvas.height-gap-100) + 50;
                entities.push({x: canvas.width, top: topH, bottom: topH+gap, passed:false});
            }

            ctx.fillStyle = "#3b82f6";
            for(let i=0; i<entities.length; i++) {
                let p = entities[i]; p.x -= 4;
                ctx.fillRect(p.x, 0, 40, p.top); ctx.fillRect(p.x, p.bottom, 40, canvas.height - p.bottom);

                if(canvas.width/3 + player.r > p.x && canvas.width/3 - player.r < p.x+40 && (player.y-player.r < p.top || player.y+player.r > p.bottom)) gameOver();
                if(p.x+40 < canvas.width/3 && !p.passed) { p.passed = true; gScore+=10; }
                if(p.x < -50) { entities.splice(i,1); i--; }
            }
            if(player.y > canvas.height || player.y < 0) gameOver();
        }

        // --- CONTROLS ---
        canvas.addEventListener("touchstart", (e) => {
            if(!isGameRunning) return;
            let tx = e.touches[0].clientX;
            if(currentGame === 'train') { if(tx < canvas.width/2 && player.lane > 0) player.lane--; else if(tx > canvas.width/2 && player.lane < 2) player.lane++; }
            if(currentGame === 'rocket') { player.v = player.jump; }
        });
        window.addEventListener("keydown", (e) => {
            if(!isGameRunning) return;
            if(currentGame === 'train') { if(e.key==="ArrowLeft" && player.lane>0) player.lane--; if(e.key==="ArrowRight" && player.lane<2) player.lane++; }
            if(currentGame === 'rocket' && e.code==="Space") player.v = player.jump;
        });

    </script>
</body>
</html>
