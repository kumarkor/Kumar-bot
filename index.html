<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mega Game Hub | Play Offline</title>
    
    <link id="manifest-link" rel="manifest" href="">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           1. PREMIUM GLOBAL UI (Glassmorphism)
        ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            color: #fff; font-family: 'Poppins', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden;
        }

        /* 📱 MAIN APP CONTAINER */
        .app-container {
            width: 100%; max-width: 420px; height: 100%; max-height: 800px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; display: flex; flex-direction: column; position: relative; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); overflow: hidden;
        }

        /* =========================================
           2. HUB SCREEN (Menu)
        ========================================= */
        #hubScreen { width: 100%; height: 100%; padding: 30px 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .hub-header { text-align: center; margin-bottom: 30px; }
        .hub-header h1 { font-size: 28px; font-weight: 800; background: linear-gradient(90deg, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hub-header p { color: #aaa; font-size: 13px; margin-top: 5px; }

        /* Game Cards */
        .game-card {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s;
        }
        .game-card:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .game-icon { width: 60px; height: 60px; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 30px; }
        .bg-train { background: linear-gradient(135deg, #e94560, #ff2e63); }
        .bg-rocket { background: linear-gradient(135deg, #8e2de2, #4a00e0); }
        .game-info h3 { font-size: 18px; font-weight: 600; margin-bottom: 5px; }
        .game-info p { font-size: 12px; color: #bbb; }

        .btn-install {
            background: linear-gradient(90deg, #11998e, #38ef7d); color: white; border: none; 
            padding: 15px; font-weight: 600; border-radius: 15px; margin-top: auto; cursor: pointer; display: none;
        }

        /* =========================================
           3. GAME SCREENS (Shared)
        ========================================= */
        .game-screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; padding: 20px 10px; font-family: 'Press Start 2P', monospace; }
        .game-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 10px; }
        .btn-back { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 8px; font-family: 'Poppins'; cursor: pointer; }
        .score-text { font-size: 12px; color: #f39c12; }
        
        canvas { background: #111; border: 2px solid rgba(255,255,255,0.2); border-radius: 15px; box-shadow: inset 0 0 20px #000; width: 100%; max-width: 360px; height: 450px; }

        /* Game Over Overlay */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }
        .btn-play { background: linear-gradient(90deg, #ff416c, #ff4b2b); color: white; border: none; padding: 15px 30px; font-family: 'Press Start 2P'; font-size: 12px; border-radius: 12px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- =========================================
             SCREEN 1: THE GAMING HUB
        ========================================= -->
        <div id="hubScreen">
            <div class="hub-header">
                <h1>ARCADE HUB</h1>
                <p>Premium Offline Games</p>
            </div>

            <!-- Game 1: Train Rush -->
            <div class="game-card" onclick="openGame('train')">
                <div class="game-icon bg-train">🚂</div>
                <div class="game-info">
                    <h3>Train Rush</h3>
                    <p>Dodge the red blocks & collect coins on the track!</p>
                </div>
            </div>

            <!-- Game 2: Galaxy Rocket (NEW!) -->
            <div class="game-card" onclick="openGame('rocket')">
                <div class="game-icon bg-rocket">🚀</div>
                <div class="game-info">
                    <h3>Galaxy Rocket</h3>
                    <p>Tap to fly! Avoid the asteroids in space.</p>
                </div>
            </div>

            <button class="btn-install" id="installBtn" onclick="installApp()">📲 INSTALL APP TO PLAY OFFLINE</button>
        </div>

        <!-- =========================================
             SCREEN 2: TRAIN RUSH GAME
        ========================================= -->
        <div id="trainScreen" class="game-screen">
            <div class="game-header">
                <button class="btn-back" onclick="goHome()">⬅ Back</button>
                <div class="score-text">SCORE: <span id="trainScore">0</span></div>
            </div>
            <canvas id="trainCanvas" width="360" height="450"></canvas>
            <p style="font-size: 10px; color: #aaa; margin-top: 15px; font-family: 'Poppins';">Tap Left or Right to switch tracks</p>
            
            <div class="overlay" id="trainOverlay">
                <h2 style="color: #e94560; font-size: 20px; margin-bottom: 10px;">CRASHED!</h2>
                <button class="btn-play" onclick="startTrainGame()">PLAY AGAIN</button>
            </div>
        </div>

        <!-- =========================================
             SCREEN 3: GALAXY ROCKET GAME (NEW)
        ========================================= -->
        <div id="rocketScreen" class="game-screen">
            <div class="game-header">
                <button class="btn-back" onclick="goHome()">⬅ Back</button>
                <div class="score-text">SCORE: <span id="rocketScore">0</span></div>
            </div>
            <canvas id="rocketCanvas" width="360" height="450"></canvas>
            <p style="font-size: 10px; color: #aaa; margin-top: 15px; font-family: 'Poppins';">Tap screen to fly upwards!</p>
            
            <div class="overlay" id="rocketOverlay">
                <h2 style="color: #8e2de2; font-size: 20px; margin-bottom: 10px;">GAME OVER</h2>
                <button class="btn-play" style="background: linear-gradient(90deg, #8e2de2, #4a00e0);" onclick="startRocketGame()">TRY AGAIN</button>
            </div>
        </div>

    </div>

    <!-- =========================================
         JAVASCRIPT LOGIC
    ========================================= -->
    <script>
        /* --- APP INSTALL MAGIC --- */
        const manifest = { "name": "Arcade Hub", "short_name": "Arcade", "start_url": window.location.href, "display": "standalone", "background_color": "#0f0c29", "theme_color": "#3a7bd5", "icons": [{ "src": "https://cdn-icons-png.flaticon.com/512/808/808476.png", "sizes": "512x512", "type": "image/png" }] };
        document.getElementById('manifest-link').setAttribute('href', URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'})));
        
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('installBtn').style.display = 'block'; });
        function installApp() { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; document.getElementById('installBtn').style.display = 'none'; } }

        /* --- UI NAVIGATION --- */
        function openGame(game) {
            document.getElementById('hubScreen').style.display = 'none';
            if(game === 'train') { document.getElementById('trainScreen').style.display = 'flex'; startTrainGame(); }
            if(game === 'rocket') { document.getElementById('rocketScreen').style.display = 'flex'; startRocketGame(); }
        }
        function goHome() {
            trainGameOverFlag = true; rocketGameOverFlag = true; // Stop loops
            document.getElementById('trainScreen').style.display = 'none';
            document.getElementById('rocketScreen').style.display = 'none';
            document.getElementById('hubScreen').style.display = 'flex';
        }

        /* =========================================
           GAME 1: TRAIN RUSH LOGIC
        ========================================= */
        const tCanvas = document.getElementById("trainCanvas"); const tCtx = tCanvas.getContext("2d");
        let tLoop, trainGameOverFlag = true, tScore = 0, tSpeed = 5, tLane = 1, tFrames = 0;
        const tLanes = [tCanvas.width/6, tCanvas.width/2, tCanvas.width*5/6];
        let tObs = [];

        function startTrainGame() {
            document.getElementById('trainOverlay').style.display = 'none';
            tScore = 0; tSpeed = 5; tLane = 1; tObs = []; tFrames = 0; trainGameOverFlag = false;
            document.getElementById('trainScore').innerText = tScore;
            trainLoop();
        }

        function trainLoop() {
            if(trainGameOverFlag) return;
            tCtx.clearRect(0,0,tCanvas.width, tCanvas.height);
            
            // Draw Tracks
            tCtx.strokeStyle = "#333"; tCtx.lineWidth = 2;
            for(let i=1; i<3; i++) { tCtx.beginPath(); tCtx.moveTo(i*tCanvas.width/3, 0); tCtx.lineTo(i*tCanvas.width/3, tCanvas.height); tCtx.stroke(); }
            
            // Draw Train
            let tx = tLanes[tLane] - 20, ty = tCanvas.height - 80;
            tCtx.fillStyle = "#e94560"; tCtx.fillRect(tx, ty, 40, 70);
            tCtx.fillStyle = "#fff"; tCtx.fillRect(tx+5, ty+10, 30, 20);

            // Obstacles
            tFrames++;
            if(tFrames % 50 === 0) tObs.push({x: tLanes[Math.floor(Math.random()*3)] - 20, y: -50, w: 40, h: 50, passed: false});
            
            for(let i=0; i<tObs.length; i++) {
                let o = tObs[i]; o.y += tSpeed;
                tCtx.fillStyle = "#ffcc00"; tCtx.fillRect(o.x, o.y, o.w, o.h); // Box
                
                // Collision
                if(Math.abs(o.x - tx) < 30 && o.y + o.h > ty && o.y < ty + 70) {
                    trainGameOverFlag = true; document.getElementById('trainOverlay').style.display = 'flex';
                }
                if(o.y > tCanvas.height && !o.passed) { o.passed = true; tScore+=10; document.getElementById('trainScore').innerText = tScore; tSpeed+=0.1; }
            }
            requestAnimationFrame(trainLoop);
        }
        tCanvas.addEventListener("touchstart", (e) => {
            if(e.touches[0].clientX < window.innerWidth/2 && tLane > 0) tLane--;
            else if(e.touches[0].clientX > window.innerWidth/2 && tLane < 2) tLane++;
        });

        /* =========================================
           GAME 2: GALAXY ROCKET LOGIC (NEW)
        ========================================= */
        const rCanvas = document.getElementById("rocketCanvas"); const rCtx = rCanvas.getContext("2d");
        let rLoop, rocketGameOverFlag = true, rScore = 0, rFrames = 0;
        let rocket = { y: 200, velocity: 0, gravity: 0.5, jump: -7 };
        let pipes = [];

        function startRocketGame() {
            document.getElementById('rocketOverlay').style.display = 'none';
            rScore = 0; rFrames = 0; rocket.y = 200; rocket.velocity = 0; pipes = []; rocketGameOverFlag = false;
            document.getElementById('rocketScore').innerText = rScore;
            rocketLoop();
        }

        function rocketLoop() {
            if(rocketGameOverFlag) return;
            rCtx.clearRect(0,0,rCanvas.width, rCanvas.height);

            // Physics
            rocket.velocity += rocket.gravity;
            rocket.y += rocket.velocity;

            // Draw Rocket
            rCtx.fillStyle = "#00d2ff";
            rCtx.beginPath(); rCtx.arc(50, rocket.y, 15, 0, Math.PI*2); rCtx.fill();
            rCtx.fillStyle = "#ff4b2b"; rCtx.beginPath(); rCtx.arc(35, rocket.y + 10, 8, 0, Math.PI*2); rCtx.fill(); // Fire

            // Draw Obstacles (Asteroids/Pipes)
            rFrames++;
            if(rFrames % 90 === 0) {
                let gap = 120; let topH = Math.random() * (rCanvas.height - gap - 50) + 20;
                pipes.push({ x: rCanvas.width, top: topH, bottom: topH + gap, passed: false });
            }

            rCtx.fillStyle = "#8e2de2";
            for(let i=0; i<pipes.length; i++) {
                let p = pipes[i]; p.x -= 3;
                rCtx.fillRect(p.x, 0, 40, p.top); // Top pipe
                rCtx.fillRect(p.x, p.bottom, 40, rCanvas.height - p.bottom); // Bottom pipe

                // Collision
                if(50+15 > p.x && 50-15 < p.x+40 && (rocket.y-15 < p.top || rocket.y+15 > p.bottom)) {
                    rocketGameOverFlag = true; document.getElementById('rocketOverlay').style.display = 'flex';
                }
                if(p.x + 40 < 50 && !p.passed) { p.passed = true; rScore+=10; document.getElementById('rocketScore').innerText = rScore; }
            }

            // Floor/Ceiling Death
            if(rocket.y > rCanvas.height || rocket.y < 0) { rocketGameOverFlag = true; document.getElementById('rocketOverlay').style.display = 'flex'; }

            requestAnimationFrame(rocketLoop);
        }
        rCanvas.addEventListener("touchstart", () => { rocket.velocity = rocket.jump; });
        rCanvas.addEventListener("mousedown", () => { rocket.velocity = rocket.jump; });
    </script>
</body>
</html>
