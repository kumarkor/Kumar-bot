<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Rush 2.0 | Mega Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           GLOBAL STYLES & UI
        ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%); 
            color: #fff; font-family: 'Press Start 2P', monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; touch-action: none;
        }

        .game-container {
            width: 100%; max-width: 420px; height: 100%; max-height: 750px;
            background: linear-gradient(180deg, #162447, #1f4068);
            border: 5px solid #e94560; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 10px; position: relative; 
            box-shadow: 0 15px 40px rgba(233, 69, 96, 0.5), inset 0 0 20px rgba(0,0,0,0.5);
        }

        .header { width: 100%; display: flex; justify-content: space-between; padding: 0 15px; margin-bottom: 10px; }
        .score-box { text-align: left; }
        .high-score-box { text-align: right; color: #f39c12; }
        .score-title { font-size: 10px; color: #aaa; margin-bottom: 5px; }
        .score-val { font-size: 18px; font-weight: bold; }

        .title-text { font-size: 16px; color: #e94560; text-align: center; margin-bottom: 15px; text-shadow: 2px 2px 0px #000; }

        canvas {
            background: #222; border: 3px solid #fff; border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
            width: 100%; max-width: 360px; height: 450px;
        }

        .controls-hint { 
            font-size: 10px; color: #00d2ff; margin-top: 20px; text-align: center; 
            line-height: 1.8; background: rgba(0, 0, 0, 0.4); padding: 10px; border-radius: 10px; width: 90%;
        }

        /* OVERLAYS (Start / Game Over) */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 20, 0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10; border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        .btn-play {
            background: linear-gradient(90deg, #e94560, #ff2e63); color: white; border: none; 
            padding: 18px 30px; font-family: 'Press Start 2P', monospace; font-size: 14px;
            border-radius: 12px; cursor: pointer; box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
            margin-top: 30px; transition: 0.2s; border: 2px solid #fff;
        }
        .btn-play:hover { transform: scale(1.1); box-shadow: 0 8px 25px rgba(233, 69, 96, 0.8); }

        .coin-icon { color: #f1c40f; }
        .danger-icon { color: #e74c3c; }

    </style>
</head>
<body>

    <div class="game-container">
        
        <h2 class="title-text">🚂 TRAIN RUSH 2.0</h2>

        <div class="header">
            <div class="score-box">
                <div class="score-title">SCORE</div>
                <div class="score-val" id="scoreDisplay">0</div>
            </div>
            <div class="high-score-box">
                <div class="score-title">HIGH SCORE</div>
                <div class="score-val" id="highScoreDisplay">0</div>
            </div>
        </div>

        <!-- THE GAME CANVAS -->
        <canvas id="gameCanvas" width="360" height="450"></canvas>

        <div class="controls-hint">
            <p>👈 TAP LEFT to move Left</p>
            <p>👉 TAP RIGHT to move Right</p>
            <p style="margin-top:5px; font-size:8px; color:#aaa;">Avoid <span class="danger-icon">🟥 Red Blocks</span> | Collect <span class="coin-icon">🟡 Coins</span></p>
        </div>

        <!-- START / GAME OVER SCREEN -->
        <div class="overlay" id="startScreen">
            <h2 id="screenTitle" style="color: #00d2ff; margin-bottom: 20px; text-align:center; font-size:24px; line-height: 1.5;">MEGA<br>TRAIN RUSH</h2>
            <p id="finalScore" style="color: #fff; font-size: 14px; display: none; margin-bottom: 10px;">Score: <span id="fsVal">0</span></p>
            <p id="newHighScoreMsg" style="color: #f1c40f; font-size: 12px; display: none; animation: blink 1s infinite;">🏆 NEW HIGH SCORE! 🏆</p>
            
            <button class="btn-play" id="startBtn" onclick="startGame()">▶ PLAY NOW</button>
        </div>
    </div>

    <!-- =========================================
         JAVASCRIPT LOGIC (THE BRAIN)
    ========================================= -->
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        // Game Variables
        let score = 0;
        let highScore = localStorage.getItem("trainRushHighScore") || 0;
        document.getElementById("highScoreDisplay").innerText = highScore;
        
        let gameLoop;
        let isGameOver = false;
        let speed = 5;
        let frameCount = 0;
        let trackOffset = 0;

        // Tracks (3 Lanes)
        const laneWidth = canvas.width / 3;
        const lanes = [laneWidth/2, laneWidth + laneWidth/2, laneWidth*2 + laneWidth/2]; 
        let trainLane = 1; 

        // Train Size
        const trainW = 46;
        const trainH = 80;
        
        let obstacles = [];
        let coins = [];

        // Sound Context (Synthetic Beeps)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // High pitch A5
                osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Draw Moving Tracks
        function drawTracks() {
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 4;
            trackOffset += speed;
            if(trackOffset > 50) trackOffset = 0;

            for(let i=1; i<3; i++) {
                ctx.beginPath();
                ctx.moveTo(i * laneWidth, 0);
                ctx.lineTo(i * laneWidth, canvas.height);
                ctx.stroke();
            }

            // Draw sleepers (horizontal lines)
            ctx.strokeStyle = "#333";
            ctx.lineWidth = 2;
            for(let y = trackOffset - 50; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // Draw Player Train
        function drawTrain() {
            let x = lanes[trainLane] - trainW / 2;
            let y = canvas.height - trainH - 15;
            
            // Main Body
            ctx.fillStyle = "#00d2ff";
            ctx.fillRect(x, y, trainW, trainH);
            ctx.fillStyle = "#3a86ff"; // Shadow
            ctx.fillRect(x + trainW - 10, y, 10, trainH);
            
            // Window
            ctx.fillStyle = "#fff";
            ctx.fillRect(x + 8, y + 15, trainW - 16, 20);
            
            // Headlight
            ctx.fillStyle = "#f1c40f";
            ctx.beginPath();
            ctx.arc(x + trainW/2, y + 5, 6, 0, Math.PI * 2);
            ctx.fill();
        }

        // Generate Objects
        function createObjects() {
            let lane = Math.floor(Math.random() * 3);
            let type = Math.random() > 0.7 ? 'coin' : 'obstacle'; // 30% chance of coin
            
            if (type === 'obstacle') {
                obstacles.push({ x: lanes[lane] - 25, y: -60, w: 50, h: 60, lane: lane });
            } else {
                coins.push({ x: lanes[lane], y: -30, r: 15, lane: lane });
            }
        }

        function updateObjects() {
            // Obstacles (Red Blocks)
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.y += speed;
                
                ctx.fillStyle = "#e94560"; // Red color
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                // Striped pattern on obstacle
                ctx.fillStyle = "#000";
                ctx.fillRect(obs.x, obs.y + 20, obs.w, 10);

                // Collision Detection
                if (obs.lane === trainLane && obs.y + obs.h > canvas.height - trainH - 15 && obs.y < canvas.height - 15) {
                    gameOver();
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById("scoreDisplay").innerText = score;
                    if(score % 100 === 0) speed += 0.3; // Increase speed slightly
                    i--;
                }
            }

            // Coins (Yellow Circles)
            for (let i = 0; i < coins.length; i++) {
                let coin = coins[i];
                coin.y += speed;
                
                ctx.fillStyle = "#f1c40f";
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#d4ac0d";
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, coin.r - 4, 0, Math.PI * 2);
                ctx.fill();

                // Coin Collection Logic
                if (coin.lane === trainLane && coin.y + coin.r > canvas.height - trainH - 15 && coin.y - coin.r < canvas.height - 15) {
                    coins.splice(i, 1);
                    score += 50; // Bonus points
                    document.getElementById("scoreDisplay").innerText = score;
                    playSound('coin');
                    i--;
                } else if (coin.y > canvas.height) {
                    coins.splice(i, 1);
                    i--;
                }
            }
        }

        // Main Game Loop
        function loop() {
            if (isGameOver) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTracks();
            drawTrain();
            
            frameCount++;
            // Generate objects faster as speed increases
            let spawnRate = Math.max(30, 70 - Math.floor(speed * 2)); 
            if (frameCount % spawnRate === 0) {
                createObjects();
            }
            
            updateObjects();
            gameLoop = requestAnimationFrame(loop);
        }

        // Start Game
        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("newHighScoreMsg").style.display = "none";
            score = 0;
            speed = 5;
            obstacles = [];
            coins = [];
            trainLane = 1;
            isGameOver = false;
            frameCount = 0;
            document.getElementById("scoreDisplay").innerText = score;
            loop();
        }

        // Game Over
        function gameOver() {
            isGameOver = true;
            cancelAnimationFrame(gameLoop);
            playSound('crash');
            
            document.getElementById("startScreen").style.display = "flex";
            document.getElementById("screenTitle").innerText = "CRASHED! 💥";
            document.getElementById("fsVal").innerText = score;
            document.getElementById("finalScore").style.display = "block";
            document.getElementById("startBtn").innerText = "TRY AGAIN";

            // Save High Score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("trainRushHighScore", highScore);
                document.getElementById("highScoreDisplay").innerText = highScore;
                document.getElementById("newHighScoreMsg").style.display = "block";
            }
        }

        // Controls (Touch for Mobile)
        window.addEventListener("touchstart", function(e) {
            let touchX = e.touches[0].clientX;
            let screenWidth = window.innerWidth;
            if (touchX < screenWidth / 2 && trainLane > 0) trainLane--;
            else if (touchX > screenWidth / 2 && trainLane < 2) trainLane++;
        });

        // Controls (Keyboard for PC)
        window.addEventListener("keydown", function(e) {
            if (e.key === "ArrowLeft" && trainLane > 0) trainLane--;
            if (e.key === "ArrowRight" && trainLane < 2) trainLane++;
        });

    </script>
</body>
</html>
