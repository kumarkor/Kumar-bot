<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classic Games Hub</title>
    <link rel="manifest" href="manifest.json">
    <style>
     /* ==========================================================
           PREMIUM GLASSMORPHISM & GLOBAL STYLES
        ========================================================== */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', Tahoma, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #020617; color: #f8fafc; overflow: hidden; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; height: 100vh; background: radial-gradient(circle at top right, #1e1b4b, #020617); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.9); }
        
        /* Premium Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10; }
        .logo { font-size: 22px; font-weight: 900; background: linear-gradient(90deg, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        .coins { background: rgba(0,0,0,0.5); border: 1px solid #f59e0b; padding: 6px 16px; border-radius: 30px; color: #fcd34d; font-weight: 900; display: flex; align-items: center; gap: 6px; box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }

        /* Screens */
        .screen { display: none; flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 90px; animation: fadeUp 0.4s ease; }
        .screen.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .title { font-size: 20px; font-weight: 900; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: #fff; }
        .title::before { content: ''; display: block; width: 6px; height: 24px; background: #38bdf8; border-radius: 4px; }

        /* Install Button (Pulsing Neon Effect) */
        #installBtn { display: none; background: linear-gradient(90deg, #10b981, #059669); color: white; padding: 15px; text-align: center; font-weight: 900; font-size: 14px; border-radius: 12px; margin-bottom: 20px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; animation: pulseGlow 2s infinite; border: 1px solid #34d399; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); } 70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        /* Glassmorphism Game Grid */
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .g-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 20px 10px; text-align: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; overflow: hidden; }
        .g-card:active, .g-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 25px rgba(0,0,0,0.5); border-color: rgba(255,255,255,0.2); }
        
        .g-icon { font-size: 45px; margin-bottom: 10px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); transition: transform 0.3s; }
        .g-card:hover .g-icon, .g-card:active .g-icon { transform: scale(1.1) rotate(5deg); }
        .g-name { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Dynamic Top Borders & Glow for each card */
        .g-card:nth-child(1) { border-top: 3px solid #ef4444; background: linear-gradient(180deg, rgba(239,68,68,0.1), transparent); }
        .g-card:nth-child(2) { border-top: 3px solid #38bdf8; background: linear-gradient(180deg, rgba(56,189,248,0.1), transparent); }
        .g-card:nth-child(3) { border-top: 3px solid #a855f7; background: linear-gradient(180deg, rgba(168,85,247,0.1), transparent); }
        .g-card:nth-child(4) { border-top: 3px solid #10b981; background: linear-gradient(180deg, rgba(16,185,129,0.1), transparent); }
        .g-card:nth-child(5) { border-top: 3px solid #f59e0b; background: linear-gradient(180deg, rgba(245,158,11,0.1), transparent); }
        .g-card:nth-child(6) { border-top: 3px solid #ec4899; background: linear-gradient(180deg, rgba(236,72,153,0.1), transparent); }
        .g-card:nth-child(7) { border-top: 3px solid #eab308; background: linear-gradient(180deg, rgba(234,179,8,0.1), transparent); }
        .g-card:nth-child(8) { border-top: 3px solid #6366f1; background: linear-gradient(180deg, rgba(99,102,241,0.1), transparent); }
        .g-card:nth-child(9) { border-top: 3px solid #14b8a6; background: linear-gradient(180deg, rgba(20,184,166,0.1), transparent); }
        .g-card:nth-child(10) { border-top: 3px solid #f43f5e; background: linear-gradient(180deg, rgba(244,63,94,0.1), transparent); }

        /* UI Cards (History, Shop) */
        .list-card { background: linear-gradient(145deg, rgba(30,41,59,0.8), rgba(15,23,42,0.8)); padding: 15px; border-radius: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); border-left: 4px solid #10b981; }
        
        /* Floating Bottom Nav */
        .nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); border-radius: 20px 20px 0 0; padding-bottom: 5px; z-index: 50; }
        .nav-item { color: #64748b; font-size: 11px; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.3s; }
        .nav-item.active { color: #38bdf8; transform: translateY(-4px); }
        .nav-item.active::after { content: ''; width: 20px; height: 4px; background: #38bdf8; border-radius: 5px; margin-top: 2px; box-shadow: 0 0 10px #38bdf8; }

        /* ==========================================================
           GAME ENGINE OVERLAY & DOM UI
        ========================================================== */
        #gameOverlay { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: #020617; z-index: 100; flex-direction: column; }
        .g-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .btn-exit { background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-exit:active { transform: scale(0.9); }
        
        /* Game Areas */
        #canvasArea { flex: 1; display: none; width: 100%; }
        #domArea { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

        /* Specific Game UI Elements */
        .ox-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: rgba(56,189,248,0.2); padding: 8px; border-radius: 16px; border: 2px solid #38bdf8; }
        .ox-cell { width: 80px; height: 80px; background: #1e293b; display: flex; justify-content: center; align-items: center; font-size: 45px; font-weight: 900; cursor: pointer; color: #fff; border-radius: 10px; transition: 0.2s; }
        .ox-cell:active { transform: scale(0.9); }
        
        .mem-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .mem-card { width: 65px; height: 65px; background: linear-gradient(135deg, #334155, #1e293b); display: flex; justify-content: center; align-items: center; font-size: 35px; border-radius: 12px; cursor: pointer; border: 2px solid #475569; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        .dots-board { position: relative; width: 300px; height: 300px; }
        .dot { position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 2; box-shadow: 0 0 10px rgba(255,255,255,0.8); }
        .line-h { position: absolute; height: 20px; background: transparent; cursor: pointer; z-index: 1; transform: translateY(-50%); transition: 0.2s; }
        .line-v { position: absolute; width: 20px; background: transparent; cursor: pointer; z-index: 1; transform: translateX(-50%); transition: 0.2s; }
        .line-active { background: #38bdf8 !important; box-shadow: 0 0 15px #38bdf8; border-radius: 10px; }
        .box-fill { position: absolute; z-index: 0; display: none; border-radius: 8px; }

    <!-- SHOP -->
    <div id="menu-shop" class="screen">
        <div class="title">Store</div>
        <div class="list-card">
            <div><strong>VIP Pass</strong><br><small>Double Coins in all games</small></div>
            <button style="padding:5px 10px; background:#10b981; border:none; border-radius:5px; color:#fff;" onclick="buyItem('VIP', 1000)">🟡 1000</button>
        </div>
    </div>

    <!-- HISTORY -->
    <div id="menu-history" class="screen">
        <div class="title">Coin History</div>
        <div id="histList"></div>
    </div>

    <!-- PROFILE -->
    <div id="menu-profile" class="screen">
        <div class="title">Profile</div>
        <div style="text-align:center; padding:30px; background:#020617; border-radius:12px;">
            <div style="font-size:50px;">😎</div>
            <h2 style="margin:10px 0;">Player 1</h2>
            <p style="color:#10b981;">Total Earned: <span id="uiTotal">0</span> 🟡</p>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="nav">
        <div class="nav-item active" onclick="nav('menu-games', this)">🎮 Games</div>
        <div class="nav-item" onclick="nav('menu-shop', this)">🛒 Shop</div>
        <div class="nav-item" onclick="nav('menu-history', this)">🧾 History</div>
        <div class="nav-item" onclick="nav('menu-profile', this)">👤 Profile</div>
    </div>

    <!-- GAME OVERLAY -->
    <div id="gameOverlay">
        <div class="g-header">
            <div style="color:#38bdf8; font-weight:bold;" id="gTitle">Game</div>
            <button class="btn-exit" onclick="exitGame()">EXIT</button>
        </div>
        
        <div style="text-align:center; color:#f59e0b; padding:10px; font-weight:bold;" id="gStatus">Score: 0</div>
        
        <canvas id="canvasArea"></canvas>
        <div id="domArea"></div>
    </div>

</div>

<script>
    // ==========================================================
    // SYSTEM: STORAGE & PWA INSTALL
    // ==========================================================
    let user = JSON.parse(localStorage.getItem('classicHub')) || { coins:0, total:0, hist:[], items:[] };
    function save() { localStorage.setItem('classicHub', JSON.stringify(user)); updateUI(); }
    function updateUI() { 
        document.getElementById('uiCoins').innerText = user.coins; 
        document.getElementById('uiTotal').innerText = user.total;
        let hHTML = '';
        user.hist.forEach(h => { hHTML += `<div class="list-card"><span>${h.r}</span><strong style="color:#10b981">+${h.a}</strong></div>`; });
        document.getElementById('histList').innerHTML = hHTML || '<p>No history.</p>';
    }
    function addCoins(amt, reason) { user.coins+=amt; user.total+=amt; user.hist.unshift({r:reason, a:amt}); if(user.hist.length>20) user.hist.pop(); save(); }
    function buyItem(id, price) { if(user.coins>=price && !user.items.includes(id)) { user.coins-=price; user.items.push(id); save(); alert("Bought!"); } }
    
    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active'); el.classList.add('active');
    }
    updateUI();

    // PWA Install
    if('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('installBtn').style.display = 'block'; });
    function installApp() { if(deferredPrompt) { deferredPrompt.prompt(); deferredPrompt=null; document.getElementById('installBtn').style.display='none'; } }

    // ==========================================================
    // GAME ENGINE CONTROLLER (MODULAR ARCHITECTURE)
    // ==========================================================
    const overlay = document.getElementById('gameOverlay');
    const domArea = document.getElementById('domArea');
    const canvasArea = document.getElementById('canvasArea');
    const ctx = canvasArea.getContext('2d');
    let currentGameObj = null, gameReq = null, gScore = 0;

    function startGame(id) {
        overlay.style.display = 'flex';
        document.getElementById('gTitle').innerText = id;
        document.getElementById('gStatus').innerText = "Score: 0";
        domArea.innerHTML = ''; ctx.clearRect(0,0,canvasArea.width, canvasArea.height);
        
        // Select Game Block
        if(id === 'OX') currentGameObj = Game_OX;
        else if(id === 'MEMORY') currentGameObj = Game_Memory;
        else if(id === 'DOTS') currentGameObj = Game_Dots;
        else if(id === 'PONG') currentGameObj = Game_Pong;
        else if(id === 'SNAKE') currentGameObj = Game_Snake;
        else if(id === 'RPS') currentGameObj = Game_RPS;
        else if(id === 'SIMON') currentGameObj = Game_Simon;
        else if(id === 'MATH') currentGameObj = Game_Math;
        else if(id === 'TAP') currentGameObj = Game_Tap;
        else if(id === 'CATCH') currentGameObj = Game_Catch;

        // Init Game Type
        if(currentGameObj.type === 'DOM') { canvasArea.style.display='none'; domArea.style.display='flex'; currentGameObj.init(); }
        else { 
            domArea.style.display='none'; canvasArea.style.display='block'; 
            canvasArea.width = window.innerWidth; canvasArea.height = window.innerHeight - 100;
            currentGameObj.init(); 
            gameReq = requestAnimationFrame(gameLoop);
        }
    }

    function gameLoop() { if(currentGameObj && currentGameObj.type === 'CANVAS') { currentGameObj.loop(); gameReq = requestAnimationFrame(gameLoop); } }
    
    function exitGame() { 
        overlay.style.display = 'none'; cancelAnimationFrame(gameReq); 
        if(currentGameObj && currentGameObj.cleanup) currentGameObj.cleanup(); 
        currentGameObj = null; 
    }

    function gameWin(coins, msg) {
        if(user.items.includes('VIP')) coins *= 2;
        addCoins(coins, msg);
        document.getElementById('gStatus').innerText = `You Won! +${coins} 🟡`;
        setTimeout(exitGame, 2000);
    }

    // ==========================================================
    // 💡 GAME 1: OX (TIC-TAC-TOE vs AI)
    // ==========================================================
    const Game_OX = {
        type: 'DOM', board: [], turn: 'X', active: true,
        init: function() {
            this.board = ['','','','','','','','','']; this.turn = 'X'; this.active = true;
            domArea.innerHTML = '<div class="ox-board" id="oxBoard"></div>';
            let html = '';
            for(let i=0; i<9; i++) html += `<div class="ox-cell" onclick="Game_OX.play(${i})" id="ox${i}"></div>`;
            document.getElementById('oxBoard').innerHTML = html;
        },
        play: function(i) {
            if(this.board[i] !== '' || !this.active || this.turn === 'O') return;
            this.board[i] = 'X'; document.getElementById('ox'+i).innerText = 'X'; document.getElementById('ox'+i).style.color = '#38bdf8';
            if(this.checkWin('X')) { this.active = false; gameWin(20, 'Won OX'); return; }
            if(this.board.indexOf('') === -1) { document.getElementById('gStatus').innerText = "Draw!"; setTimeout(exitGame, 2000); return; }
            this.turn = 'O'; document.getElementById('gStatus').innerText = "AI is thinking...";
            setTimeout(() => this.aiPlay(), 600);
        },
        aiPlay: function() {
            let empty = []; this.board.forEach((v,i) => { if(v==='') empty.push(i); });
            if(empty.length > 0) {
                let pick = empty[Math.floor(Math.random()*empty.length)]; // Simple Random AI
                this.board[pick] = 'O'; document.getElementById('ox'+pick).innerText = 'O'; document.getElementById('ox'+pick).style.color = '#ef4444';
                if(this.checkWin('O')) { this.active = false; document.getElementById('gStatus').innerText = "AI Won!"; setTimeout(exitGame, 2000); return; }
            }
            this.turn = 'X'; document.getElementById('gStatus').innerText = "Your Turn (X)";
        },
        checkWin: function(p) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return wins.some(w => this.board[w[0]]===p && this.board[w[1]]===p && this.board[w[2]]===p);
        }
    };

    // ==========================================================
    // 💡 GAME 2: DOTS & BOXES (User vs AI)
    // ==========================================================
    const Game_Dots = {
        type: 'DOM', gridSize: 3, lines: {}, boxes: [], turn: 'U', pScore: 0, aiScore: 0,
        init: function() {
            this.lines = {}; this.boxes = []; this.pScore = 0; this.aiScore = 0; this.turn = 'U';
            domArea.innerHTML = '<div class="dots-board" id="dtBoard"></div>';
            let b = document.getElementById('dtBoard');
            let s = 300 / this.gridSize; // 100px per box
            
            // Draw Dots & Lines
            for(let r=0; r<=this.gridSize; r++) {
                for(let c=0; c<=this.gridSize; c++) {
                    let dot = document.createElement('div'); dot.className = 'dot'; dot.style.left = (c*s)+'px'; dot.style.top = (r*s)+'px'; b.appendChild(dot);
                    if(c < this.gridSize) {
                        let id = `H_${r}_${c}`; this.lines[id] = false;
                        let l = document.createElement('div'); l.className='line-h'; l.id=id; l.style.left=(c*s+6)+'px'; l.style.top=(r*s)+'px'; l.style.width=(s-12)+'px';
                        l.onclick = () => this.play(id); b.appendChild(l);
                    }
                    if(r < this.gridSize) {
                        let id = `V_${r}_${c}`; this.lines[id] = false;
                        let l = document.createElement('div'); l.className='line-v'; l.id=id; l.style.left=(c*s)+'px'; l.style.top=(r*s+6)+'px'; l.style.height=(s-12)+'px';
                        l.onclick = () => this.play(id); b.appendChild(l);
                    }
                    if(r<this.gridSize && c<this.gridSize) {
                        let box = document.createElement('div'); box.className='box-fill'; box.id=`B_${r}_${c}`; box.style.left=(c*s+6)+'px'; box.style.top=(r*s+6)+'px'; box.style.width=(s-12)+'px'; box.style.height=(s-12)+'px';
                        b.appendChild(box);
                    }
                }
            }
            this.updateUI();
        },
        play: function(id) {
            if(this.lines[id] || this.turn !== 'U') return;
            this.makeMove(id, 'U');
        },
        makeMove: function(id, player) {
            this.lines[id] = true; 
            let lDiv = document.getElementById(id); lDiv.style.background = player==='U'?'#38bdf8':'#ef4444'; lDiv.style.zIndex = 1;
            
            let scored = this.checkBoxes(player);
            this.updateUI();
            
            let totalLines = Object.keys(this.lines).length; let usedLines = Object.values(this.lines).filter(v=>v).length;
            if(usedLines === totalLines) {
                if(this.pScore > this.aiScore) gameWin(30, 'Won Dots'); else { document.getElementById('gStatus').innerText = "AI Won!"; setTimeout(exitGame, 2000); } return;
            }

            if(!scored) {
                this.turn = player === 'U' ? 'AI' : 'U';
                if(this.turn === 'AI') setTimeout(() => this.aiTurn(), 600);
            } else if (player === 'AI') {
                setTimeout(() => this.aiTurn(), 600); // AI plays again if scored
            }
        },
        aiTurn: function() {
            let avail = Object.keys(this.lines).filter(k => !this.lines[k]);
            if(avail.length === 0) return;
            let pick = avail[Math.floor(Math.random()*avail.length)]; // Random AI for now
            this.makeMove(pick, 'AI');
        },
        checkBoxes: function(player) {
            let scored = false;
            for(let r=0; r<this.gridSize; r++) {
                for(let c=0; c<this.gridSize; c++) {
                    let id = `B_${r}_${c}`;
                    if(!this.boxes.includes(id)) {
                        if(this.lines[`H_${r}_${c}`] && this.lines[`H_${r+1}_${c}`] && this.lines[`V_${r}_${c}`] && this.lines[`V_${r}_${c+1}`]) {
                            this.boxes.push(id); scored = true;
                            if(player==='U') this.pScore++; else this.aiScore++;
                            let bDiv = document.getElementById(id); bDiv.style.display = 'block'; bDiv.style.background = player==='U'?'rgba(56,189,248,0.5)':'rgba(239,68,68,0.5)';
                        }
                    }
                }
            }
            return scored;
        },
        updateUI: function() { document.getElementById('gStatus').innerText = `You: ${this.pScore} | AI: ${this.aiScore}  (${this.turn==='U'?"Your Turn":"AI Turn"})`; }
    };

    // ==========================================================
    // 💡 GAME 3: MEMORY MATCH
    // ==========================================================
    const Game_Memory = {
        type: 'DOM', cards: [], flipped: [], matched: 0,
        init: function() {
            let emj = ['🍎','🍌','🍇','🍉','🍓','🍒','🍍','🥝'];
            this.cards = [...emj, ...emj].sort(() => Math.random() - 0.5);
            this.flipped = []; this.matched = 0;
            domArea.innerHTML = '<div class="mem-board" id="memBoard"></div>';
            let html = '';
            this.cards.forEach((c, i) => { html += `<div class="mem-card" id="m${i}" onclick="Game_Memory.flip(${i})">❓</div>`; });
            document.getElementById('memBoard').innerHTML = html;
            document.getElementById('gStatus').innerText = "Find Pairs!";
        },
        flip: function(i) {
            let c = document.getElementById('m'+i);
            if(c.innerText !== '❓' || this.flipped.length >= 2) return;
            c.innerText = this.cards[i]; c.style.background = '#475569';
            this.flipped.push({i:i, val:this.cards[i]});
            
            if(this.flipped.length === 2) {
                setTimeout(() => {
                    if(this.flipped[0].val === this.flipped[1].val) {
                        this.matched++;
                        if(this.matched === 8) gameWin(25, 'Won Memory');
                    } else {
                        document.getElementById('m'+this.flipped[0].i).innerText = '❓'; document.getElementById('m'+this.flipped[0].i).style.background = '#334155';
                        document.getElementById('m'+this.flipped[1].i).innerText = '❓'; document.getElementById('m'+this.flipped[1].i).style.background = '#334155';
                    }
                    this.flipped = [];
                }, 800);
            }
        }
    };

    // ==========================================================
    // 💡 GAME 4: PING PONG (User vs AI)
    // ==========================================================
    const Game_Pong = {
        type: 'CANVAS',
        init: function() { 
            this.p = { y: canvasArea.height/2-40, s: 0 }; 
            this.ai = { y: canvasArea.height/2-40 }; 
            this.b = { x: canvasArea.width/2, y: canvasArea.height/2, vx: -5, vy: 5 }; 
            document.getElementById('gStatus').innerText = "Score 5 to win!";
            this.uScore = 0; this.aiScore = 0;
            
            // Touch control for paddle
            canvasArea.ontouchmove = (e) => { this.p.y = e.touches[0].clientY - 100 - 40; };
        },
        loop: function() {
            let c = canvasArea;
            // AI logic
            if(this.ai.y + 40 < this.b.y) this.ai.y += 4; else this.ai.y -= 4;
            
            // Ball physics
            this.b.x += this.b.vx; this.b.y += this.b.vy;
            if(this.b.y < 0 || this.b.y > c.height) this.b.vy *= -1;
            
            // Collisions
            if(this.b.x < 30 && this.b.y > this.p.y && this.b.y < this.p.y+80) { this.b.vx *= -1; this.b.x = 30; }
            if(this.b.x > c.width-30 && this.b.y > this.ai.y && this.b.y < this.ai.y+80) { this.b.vx *= -1; this.b.x = c.width-30; }
            
            // Score
            if(this.b.x < 0) { this.aiScore++; this.resetB(); }
            if(this.b.x > c.width) { this.uScore++; this.resetB(); }

            document.getElementById('gStatus').innerText = `You: ${this.uScore} | AI: ${this.aiScore}`;
            if(this.uScore >= 5) { gameWin(20, 'Won Pong'); this.resetB(); this.b.vx=0; this.b.vy=0; }
            if(this.aiScore >= 5) { document.getElementById('gStatus').innerText = "AI Won!"; setTimeout(exitGame, 2000); this.b.vx=0; this.b.vy=0; }

            // Draw
            ctx.fillStyle = '#1e293b'; ctx.fillRect(0,0,c.width,c.height); // BG
            ctx.fillStyle = '#38bdf8'; ctx.fillRect(20, this.p.y, 10, 80); // P1
            ctx.fillStyle = '#ef4444'; ctx.fillRect(c.width-30, this.ai.y, 10, 80); // AI
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(this.b.x, this.b.y, 8, 0, Math.PI*2); ctx.fill(); // Ball
        },
        resetB: function() { this.b.x = canvasArea.width/2; this.b.y = canvasArea.height/2; this.b.vx = -this.b.vx; }
    };

    // ==========================================================
    // 💡 GAME 5: ROCK PAPER SCISSORS
    // ==========================================================
    const Game_RPS = {
        type: 'DOM',
        init: function() {
            domArea.innerHTML = `
                <div style="font-size:80px; margin-bottom:20px;" id="rpsRes">🤔</div>
                <div style="display:flex; gap:20px;">
                    <button style="font-size:40px; padding:10px; border-radius:10px; cursor:pointer;" onclick="Game_RPS.play('R')">✊</button>
                    <button style="font-size:40px; padding:10px; border-radius:10px; cursor:pointer;" onclick="Game_RPS.play('P')">🖐️</button>
                    <button style="font-size:40px; padding:10px; border-radius:10px; cursor:pointer;" onclick="Game_RPS.play('S')">✌️</button>
                </div>
            `;
            document.getElementById('gStatus').innerText = "Choose your move!";
        },
        play: function(userChoice) {
            let moves = ['R','P','S']; let icons = {'R':'✊', 'P':'🖐️', 'S':'✌️'};
            let aiChoice = moves[Math.floor(Math.random()*3)];
            let res = document.getElementById('rpsRes');
            
            res.innerHTML = `${icons[userChoice]} vs ${icons[aiChoice]}`;
            
            if(userChoice === aiChoice) document.getElementById('gStatus').innerText = "Draw! Try again.";
            else if((userChoice==='R'&&aiChoice==='S') || (userChoice==='P'&&aiChoice==='R') || (userChoice==='S'&&aiChoice==='P')) {
                gameWin(10, 'Won RPS');
            } else {
                document.getElementById('gStatus').innerText = "AI Won!"; setTimeout(exitGame, 2000);
            }
        }
    };

    // ==========================================================
    // 💡 GAMES 6-10 (Simplified Canvas/DOM implementations to fit limits)
    // ==========================================================
    // 6. Snake Classic
    const Game_Snake = {
        type: 'CANVAS',
        init: function() { 
            this.s = 20; this.b = [{x:5,y:5}]; this.d = 'R'; this.food = {x:10,y:10}; this.frame = 0; 
            canvasArea.ontouchstart = (e) => {
                let tx = e.touches[0].clientX, ty = e.touches[0].clientY-100;
                let h = this.b[0]; let dx = tx - h.x*this.s, dy = ty - h.y*this.s;
                if(Math.abs(dx)>Math.abs(dy)) this.d = dx>0?'R':'L'; else this.d = dy>0?'D':'U';
            };
        },
        loop: function() {
            this.frame++; if(this.frame%6 !== 0) return;
            let h = {x:this.b[0].x, y:this.b[0].y};
            if(this.d==='R') h.x++; if(this.d==='L') h.x--; if(this.d==='D') h.y++; if(this.d==='U') h.y--;
            this.b.unshift(h);
            
            if(h.x===this.food.x && h.y===this.food.y) { gScore+=10; this.food = {x:Math.floor(Math.random()*(canvasArea.width/this.s)), y:Math.floor(Math.random()*(canvasArea.height/this.s))}; document.getElementById('gStatus').innerText=`Score: ${gScore}`; }
            else this.b.pop();

            if(h.x<0 || h.y<0 || h.x>=canvasArea.width/this.s || h.y>=canvasArea.height/this.s) { gameWin(Math.floor(gScore/10), 'Played Snake'); return; }

            ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,canvasArea.width,canvasArea.height);
            ctx.fillStyle='#ef4444'; ctx.fillRect(this.food.x*this.s, this.food.y*this.s, this.s, this.s);
            ctx.fillStyle='#10b981'; this.b.forEach(pt => ctx.fillRect(pt.x*this.s, pt.y*this.s, this.s-1, this.s-1));
        }
    };

    // 7. Simon (Color Pattern)
    const Game_Simon = {
        type: 'DOM', seq: [], uSeq: [],
        init: function() {
            domArea.innerHTML = `
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div id="c0" style="width:100px; height:100px; background:#ef4444; border-radius:10px;" onclick="Game_Simon.tap(0)"></div>
                    <div id="c1" style="width:100px; height:100px; background:#3b82f6; border-radius:10px;" onclick="Game_Simon.tap(1)"></div>
                    <div id="c2" style="width:100px; height:100px; background:#10b981; border-radius:10px;" onclick="Game_Simon.tap(2)"></div>
                    <div id="c3" style="width:100px; height:100px; background:#f59e0b; border-radius:10px;" onclick="Game_Simon.tap(3)"></div>
                </div>
            `;
            this.seq=[]; this.uSeq=[]; setTimeout(()=>this.nextLevel(), 1000);
        },
        nextLevel: function() {
            this.uSeq = []; this.seq.push(Math.floor(Math.random()*4));
            document.getElementById('gStatus').innerText = `Watch... (Level ${this.seq.length})`;
            let i=0;
            let t = setInterval(()=>{
                let id = 'c'+this.seq[i]; let el = document.getElementById(id);
                el.style.opacity = '0.3'; setTimeout(()=>el.style.opacity='1', 400);
                i++; if(i>=this.seq.length) { clearInterval(t); document.getElementById('gStatus').innerText = "Your Turn!"; }
            }, 800);
        },
        tap: function(n) {
            this.uSeq.push(n); let el = document.getElementById('c'+n); el.style.opacity='0.3'; setTimeout(()=>el.style.opacity='1', 200);
            if(this.uSeq[this.uSeq.length-1] !== this.seq[this.uSeq.length-1]) { gameWin(this.seq.length, 'Played Simon'); return; }
            if(this.uSeq.length === this.seq.length) setTimeout(()=>this.nextLevel(), 1000);
        }
    };

    // 8. Math Genius
    const Game_Math = {
        type: 'DOM', ans: 0, score: 0,
        init: function() {
            domArea.innerHTML = `
                <div id="mQ" style="font-size:50px; margin-bottom:20px; font-weight:bold;">2 + 2</div>
                <div style="display:flex; gap:10px;" id="mOpts"></div>
            `;
            this.score = 0; this.next();
        },
        next: function() {
            let a=Math.floor(Math.random()*20), b=Math.floor(Math.random()*20);
            this.ans = a+b; document.getElementById('mQ').innerText = `${a} + ${b} = ?`;
            let opts = [this.ans, this.ans+1, this.ans-2].sort(()=>Math.random()-0.5);
            let h = ''; opts.forEach(o => h+=`<button style="font-size:24px; padding:15px; border-radius:8px; cursor:pointer;" onclick="Game_Math.chk(${o})">${o}</button>`);
            document.getElementById('mOpts').innerHTML = h;
            document.getElementById('gStatus').innerText = `Score: ${this.score}`;
        },
        chk: function(v) { if(v===this.ans) { this.score++; this.next(); } else { gameWin(this.score, 'Math Genius'); } }
    };

    // 9. Fast Tap
    const Game_Tap = {
        type: 'DOM', score: 0, t: 10, int: null,
        init: function() {
            this.score=0; this.t=10;
            domArea.innerHTML = `<button style="width:200px; height:200px; border-radius:50%; font-size:40px; background:#ef4444; color:#fff; border:none;" onclick="Game_Tap.tap()">TAP!</button>`;
            this.int = setInterval(()=>{ this.t--; document.getElementById('gStatus').innerText = `Time: ${this.t}s | Taps: ${this.score}`; if(this.t<=0) { clearInterval(this.int); gameWin(Math.floor(this.score/5), 'Fast Tap'); } }, 1000);
        },
        tap: function() { if(this.t>0) this.score++; }
    };

    // 10. Coin Catcher
    const Game_Catch = {
        type: 'CANVAS',
        init: function() { this.x=canvasArea.width/2; this.c=[]; canvasArea.ontouchmove=(e)=>this.x=e.touches[0].clientX; gScore=0; },
        loop: function() {
            if(Math.random()<0.05) this.c.push({x:Math.random()*(canvasArea.width-20), y:0});
            ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,canvasArea.width,canvasArea.height);
            ctx.fillStyle='#38bdf8'; ctx.fillRect(this.x-30, canvasArea.height-30, 60, 20); // Basket
            ctx.fillStyle='#f59e0b';
            for(let i=0; i<this.c.length; i++) {
                let c = this.c[i]; c.y+=5; ctx.beginPath(); ctx.arc(c.x, c.y, 10, 0, Math.PI*2); ctx.fill();
                if(c.y>canvasArea.height-30 && Math.abs(c.x-this.x)<30) { gScore++; this.c.splice(i,1); i--; document.getElementById('gStatus').innerText=`Caught: ${gScore}`; }
                else if(c.y>canvasArea.height) { gameWin(Math.floor(gScore/2), 'Coin Catcher'); return; }
            }
        }
    };
</script>
</body>
</html>
