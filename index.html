<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumar Wallet Web App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; background-color: #f0f2f5; }
        .container { background: white; padding: 20px; border-radius: 15px; margin: 20px auto; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        h2 { color: #333; }
        button { padding: 12px; margin: 8px; font-size: 16px; cursor: pointer; background: #0088cc; color: white; border: none; border-radius: 8px; width: 90%; font-weight: bold; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        input { padding: 12px; font-size: 16px; text-align: center; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; width: 85%; }
        .box { background: #e9ecef; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .admin-box { background: #ffebee; border: 2px solid #ffcdd2; margin-top: 20px; }
        .banned-box { background: #ffebee; border: 3px solid #d32f2f; color: #d32f2f; padding: 30px; border-radius: 15px; margin: 50px auto; max-width: 350px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container" id="loadingScreen"><h2>⏳ Loading...</h2></div>

    <div class="banned-box" id="bannedScreen" style="display:none;">
        <h1>🚫</h1> <h2>ACCOUNT BANNED</h2>
        <p>You have been permanently banned for violating the <b>1 Device = 1 User</b> policy.</p>
    </div>

    <div class="container" id="verificationScreen" style="display:none;">
        <h2>🔐 Device Verification</h2>
        <p>Telegram ID: <b id="displayId"></b></p>
        <button id="sendOtpBtn">Send OTP to Bot</button>
        <div id="otpSection" style="display:none;">
            <input type="text" id="otpInput" placeholder="Enter 4-digit OTP">
            <br>
            <button id="verifyBtn">Verify Device</button>
        </div>
    </div>

    <div class="container" id="dashboardScreen" style="display:none;">
        <h2>🚀 Kumar Wallet</h2>
        <div class="box">
            <h3>💳 Balance</h3>
            <p style="font-size: 18px;">🪙 Coins: <b id="coinBal">0</b></p>
            <p style="font-size: 18px;">💵 Rupees: <b>₹<span id="rupeeBal">0</span></b></p>
        </div>
        <button onclick="playDice()">🎲 Play Dice Game</button>
        <button onclick="convertCoins()">💱 Convert Coins</button>
        <div class="box" style="margin-top: 15px;">
            <input type="text" id="giftInput" placeholder="Enter Gift Code">
            <button onclick="redeemGift()" style="background:#28a745;">🎁 Redeem Gift</button>
        </div>

        <div class="box admin-box" id="adminSection" style="display:none;">
            <h3 style="color: #d32f2f;">👑 Admin Panel</h3>
            <input type="text" id="newGiftCode" placeholder="Code Name (e.g. VIP50)">
            <input type="number" id="newGiftReward" placeholder="Reward Coins">
            <input type="number" id="newGiftLimit" placeholder="Usage Limit">
            <button onclick="createGift()" style="background:#d32f2f;">Create Code</button>
            <button onclick="deleteAllData()" style="background:#000; color:white; margin-top:10px;">🚨 DELETE ALL DATA</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBkJZgrlNJRoNW5sPzOIk1RExHHRGceJtk",
          authDomain: "kumar-kor.firebaseapp.com",
          databaseURL: "https://kumar-kor-default-rtdb.firebaseio.com",
          projectId: "kumar-kor",
          storageBucket: "kumar-kor.firebasestorage.app",
          messagingSenderId: "923078462955",
          appId: "1:923078462955:web:5802d80764301bd8cb9dae"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userid');
        const botToken = "8990895848:AAHc2cZJ948c1yKWAoXUoFU3WE-7-zR6_tU";
        
        let deviceLockId = localStorage.getItem("ultimate_device_lock_v1");

        if(!userId) { document.body.innerHTML = "<h2>❌ Open from Telegram Bot!</h2>"; } 
        else {
            get(ref(db, 'verified_users/' + userId)).then((snap) => {
                let data = snap.val();
                if (data && data.isBanned) { showScreen('bannedScreen'); return; }
                if (deviceLockId && deviceLockId !== userId) {
                    update(ref(db, 'verified_users/' + userId), { isBanned: true });
                    showScreen('bannedScreen'); return;
                }
                document.getElementById("displayId").innerText = userId;
                if (data && data.isVerified) { 
                    localStorage.setItem("ultimate_device_lock_v1", userId);
                    showDashboard(); 
                } else { showScreen('verificationScreen'); }
            });
        }

        function showScreen(id) {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('bannedScreen').style.display = (id === 'bannedScreen') ? 'block' : 'none';
            document.getElementById('verificationScreen').style.display = (id === 'verificationScreen') ? 'block' : 'none';
            document.getElementById('dashboardScreen').style.display = (id === 'dashboardScreen') ? 'block' : 'none';
        }

        function showDashboard() {
            showScreen('dashboardScreen');
            if(userId === "7335163273") document.getElementById("adminSection").style.display = "block";
            onValue(ref(db, 'verified_users/' + userId), (snap) => {
                let d = snap.val();
                if(d.isBanned) showScreen('bannedScreen');
                document.getElementById("coinBal").innerText = d.coins || 0;
                document.getElementById("rupeeBal").innerText = d.rupees || 0;
            });
        }

        window.createGift = function() {
            let code = document.getElementById("newGiftCode").value.trim();
            let reward = parseInt(document.getElementById("newGiftReward").value);
            let limit = parseInt(document.getElementById("newGiftLimit").value);
            set(ref(db, 'gift_codes/' + code), { reward, limit, used_count: 0 });
            alert("✅ Gift Code Created!");
        };

        window.redeemGift = function() {
            let code = document.getElementById("giftInput").value.trim();
            get(ref(db, 'gift_codes/' + code)).then((snap) => {
                if(!snap.exists()) { alert("❌ Invalid!"); return; }
                let gift = snap.val();
                if(gift.used_count >= gift.limit) { alert("❌ Limit reached!"); return; }
                get(ref(db, 'verified_users/' + userId + '/used_gifts/' + code)).then((used) => {
                    if(used.exists()) { alert("❌ Already used!"); return; }
                    update(ref(db, 'verified_users/' + userId), { coins: (parseInt(document.getElementById("coinBal").innerText) + gift.reward) });
                    update(ref(db, 'gift_codes/' + code), { used_count: gift.used_count + 1 });
                    set(ref(db, 'verified_users/' + userId + '/used_gifts/' + code), true);
                    alert("🎉 Success!");
                });
            });
        };

        window.deleteAllData = function() {
            if(confirm("🚨 DELETE ALL DATA?")) remove(ref(db, '/')).then(() => location.reload());
        };

        // OTP Logic
        let otp = "";
        document.getElementById("sendOtpBtn").onclick = () => {
            otp = Math.floor(1000 + Math.random() * 9000).toString();
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${userId}&text=🔐 OTP: ${otp}`);
            document.getElementById("sendOtpBtn").style.display = "none";
            document.getElementById("otpSection").style.display = "block";
        };
        document.getElementById("verifyBtn").onclick = () => {
            if(document.getElementById("otpInput").value == otp) {
                update(ref(db, 'verified_users/' + userId), { isVerified: true, coins: 0, rupees: 0 });
                localStorage.setItem("ultimate_device_lock_v1", userId);
                showDashboard();
            } else alert("❌ Wrong OTP");
        };

        window.playDice = () => { /* मघाचा कोड */ };
        window.convertCoins = () => { /* मघाचा कोड */ };
    </script>
</body>
</html>
